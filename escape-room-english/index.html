<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дело о похищенном сапфире</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e0b36a;--accent2:#7fb0ff;--bg:#0a0806;--panel:rgba(14,12,18,.86);--text:#f4ecdf;--muted:#c9bda8;--ok:#5fe3a1;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,.35));z-index:5;flex-wrap:wrap}
#bar h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,2.4vw,30px);color:var(--accent);font-weight:700;margin-right:auto;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.chip{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:rgba(0,0,0,.45);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.btn{cursor:pointer;border:1px solid var(--accent);background:rgba(0,0,0,.45);color:var(--text);border-radius:10px;padding:8px 14px;font:600 14px Inter,sans-serif;transition:.2s}
.btn:hover{background:var(--accent);color:#120d08}
.btn.primary{background:var(--accent);color:#120d08}
.btn.primary:hover{filter:brightness(1.12)}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
#stage{position:relative;aspect-ratio:var(--ar,16/9);width:min(100%,calc((100vh - 130px)*var(--arn,1.7778)));border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent),0 20px 60px rgba(0,0,0,.7)}
#stage img.room{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
#stage .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
.hs{position:absolute;transform:translate(-50%,-50%);width:clamp(34px,4.4vw,62px);aspect-ratio:1;border-radius:50%;cursor:pointer;display:grid;place-items:center;border:2px solid var(--accent);background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,transparent),rgba(0,0,0,.35) 70%);box-shadow:0 0 18px var(--accent),inset 0 0 12px var(--accent);color:#fff;font-size:clamp(14px,1.7vw,24px);animation:pulse 2.2s ease-in-out infinite;transition:transform .2s}
.hs:hover{transform:translate(-50%,-50%) scale(1.15)}
.hs::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 2.2s ease-out infinite}
.hs .lbl{position:absolute;top:110%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s}
.hs:hover .lbl{opacity:1}
.hs.done{border-color:var(--ok);box-shadow:0 0 16px var(--ok);background:radial-gradient(circle,rgba(95,227,161,.35),rgba(0,0,0,.4) 70%);animation:none}
.hs.done::after{display:none}
.hs.door{border-color:var(--accent2);box-shadow:0 0 22px var(--accent2),inset 0 0 12px var(--accent2)}
.hs.door::after{border-color:var(--accent2)}
@keyframes pulse{50%{box-shadow:0 0 30px var(--accent),inset 0 0 18px var(--accent)}}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
#inv{display:flex;gap:8px;justify-content:center;padding:8px 12px 12px;flex-wrap:wrap}
.slot{width:46px;height:46px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);display:grid;place-items:center;font:700 22px "Cormorant Garamond",serif;color:var(--accent);background:rgba(0,0,0,.4)}
.slot.full{border-style:solid;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.invlbl{align-self:center;font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,rgba(28,22,30,.97),rgba(12,10,14,.97));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:18px;padding:24px;box-shadow:0 0 40px color-mix(in srgb,var(--accent) 30%,transparent);animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;color:var(--accent);margin-bottom:6px}
.modal .story{color:var(--muted);font-style:italic;margin-bottom:14px;line-height:1.5}
.q{margin:14px 0;padding:14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.q p{margin-bottom:10px;line-height:1.5;font-weight:600}
.opts{display:grid;gap:8px}
.opt{cursor:pointer;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:var(--text);font:15px Inter,sans-serif;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.opt.right{border-color:var(--ok);background:rgba(95,227,161,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.15)}
select,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0d0b10;color:var(--text);font:15px Inter,sans-serif}
.row{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:center;margin-bottom:8px}
.sortgrid{display:grid;gap:8px}
.sortitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12)}
.sortitem .tg{display:flex;gap:6px}
.sortitem .tg button{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--text);cursor:pointer;font:600 13px Inter}
.sortitem .tg button.on{background:var(--accent);color:#120d08;border-color:var(--accent)}
.orderlist{display:grid;gap:8px}
.orderlist .opt .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#120d08;font-weight:700;margin-right:8px;font-size:13px}
.fb{margin-top:12px;padding:12px;border-radius:10px;display:none;line-height:1.5}
.fb.ok{display:block;background:rgba(95,227,161,.12);border:1px solid var(--ok)}
.fb.no{display:block;background:rgba(255,107,107,.1);border:1px solid var(--bad)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.digit{display:inline-grid;place-items:center;min-width:56px;height:56px;padding:0 10px;border-radius:12px;background:var(--accent);color:#120d08;font:700 32px "Cormorant Garamond",serif;margin:8px 0;box-shadow:0 0 24px var(--accent)}
#intro,#final{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:center/cover no-repeat}
#intro::before,#final::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 10%,rgba(0,0,0,.45) 55%,rgba(0,0,0,.25))}
#intro.poster::before{background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.05) 38%,transparent 60%)}
.introbox{position:relative;text-align:center;max-width:720px}
#intro.poster{align-items:flex-end}
#intro.poster .introbox{margin-bottom:5vh}
.introbox h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(34px,6vw,72px);color:var(--accent);text-shadow:0 0 30px color-mix(in srgb,var(--accent) 60%,transparent);line-height:1.05}
.introbox .sub{letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--muted);margin:10px 0 18px}
.introbox .txt{line-height:1.6;margin-bottom:22px;color:#efe6d6;text-shadow:0 1px 4px #000}
.bigbtn{cursor:pointer;padding:16px 42px;border-radius:999px;border:2px solid var(--accent);background:rgba(0,0,0,.5);color:#fff;font:700 clamp(15px,2vw,20px) "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 26px var(--accent),inset 0 0 12px var(--accent);animation:pulse2 2.4s infinite;backdrop-filter:blur(4px)}
.bigbtn:hover{background:var(--accent);color:#000}
@keyframes pulse2{50%{box-shadow:0 0 46px var(--accent),inset 0 0 18px var(--accent)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:var(--panel);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.codeIn{display:flex;gap:8px;justify-content:center;margin:12px 0}
.codeIn input{width:54px;height:62px;text-align:center;font:700 28px "Cormorant Garamond",serif;padding:0}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:35;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-width:640px){.hs .lbl{opacity:1;font-size:10px}.modal{padding:18px}.row{grid-template-columns:1fr}#bar{padding:8px 10px}.chip{padding:5px 8px;font-size:12px}}
</style>
</head>
<body>
<div id="intro"><div class="introbox"><h2 id="iTitle"></h2><div class="sub" id="iSub"></div><div class="txt" id="iTxt"></div><button class="bigbtn" id="iBtn">Войти в комнату</button></div></div>
<div id="app">
  <div id="bar"><h1 id="title"></h1><span class="chip" id="timer">25:00</span><span class="chip" id="prog"></span><button class="btn" id="hintBtn">💡 Подсказка</button><button class="btn" id="restartBtn">Начать заново</button></div>
  <div id="stageWrap"><div id="stage"><img class="room" id="room" alt=""><div class="vignette"></div></div></div>
  <div id="inv"><span class="invlbl" id="invlbl">Код двери</span></div>
</div>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div id="final" style="display:none"><div class="introbox"><h2 id="fTitle"></h2><div class="sub" id="fSub"></div><div class="txt" id="fTxt"></div><button class="bigbtn" onclick="restart()">Сыграть снова</button></div></div>
<div id="toast"></div>

const KEY="er_"+CFG.id;
let S={solved:{},start:null,hints:0};
function load(){try{const v=sessionStorage.getItem(KEY);if(v)S=JSON.parse(v)}catch(e){}}
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),3200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).trim().toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").replace(/[.!?]$/,"")}
function init(){
  load();
  document.title=CFG.title;
  $("title").textContent=CFG.title;
  $("room").src=IMG_ROOM;
  if(CFG.ar){document.documentElement.style.setProperty("--ar",CFG.ar[0]+"/"+CFG.ar[1]);document.documentElement.style.setProperty("--arn",CFG.ar[0]/CFG.ar[1])}
  const intro=$("intro");
  if(IMG_POSTER){intro.style.backgroundImage="url("+IMG_POSTER+")";intro.classList.add("poster");$("iTitle").style.display="none";$("iSub").style.display="none";$("iTxt").style.display="none"}
  else{intro.style.backgroundImage="url("+IMG_ROOM+")"}
  $("iTitle").textContent=CFG.title;$("iSub").textContent=CFG.subtitle;$("iTxt").innerHTML=CFG.intro;
  let step=0;
  $("iBtn").onclick=()=>{
    if(IMG_POSTER&&step===0){step=1;intro.classList.remove("poster");intro.style.backgroundImage="url("+IMG_ROOM+")";["iTitle","iSub","iTxt"].forEach(i=>$(i).style.display="");$("iBtn").textContent="Начать";return}
    intro.style.display="none";if(!S.start){S.start=Date.now();save()}tick();
  };
  $("hintBtn").onclick=hint;$("restartBtn").onclick=()=>{if(confirmRestart())restart()};
  $("invlbl").textContent=CFG.codeLabel||"Код двери";
  CFG.objects.forEach((o,i)=>{const s=document.createElement("div");s.className="slot";s.id="slot"+i;$("inv").appendChild(s)});
  CFG.objects.forEach((o,i)=>addHs(o,i));
  addHs(CFG.door,-1);
  render();
}
function confirmRestart(){return Object.keys(S.solved).length===0||window.confirm("Начать игру заново? Прогресс будет сброшен.")}
function addHs(o,i){const h=document.createElement("div");h.className="hs"+(i<0?" door":"");h.id="hs"+i;h.style.left=o.x+"%";h.style.top=o.y+"%";h.innerHTML=(o.icon||"✦")+'<span class="lbl">'+esc(o.name)+"</span>";h.onclick=()=>i<0?openDoor():openObj(i);$("stage").appendChild(h)}
function render(){
  const n=Object.keys(S.solved).length,t=CFG.objects.length;
  $("prog").textContent=(CFG.progressLabel||"Испытания")+": "+n+" / "+t;
  CFG.objects.forEach((o,i)=>{$("hs"+i).classList.toggle("done",!!S.solved[i]);const sl=$("slot"+i);sl.textContent=S.solved[i]?o.digit:"";sl.classList.toggle("full",!!S.solved[i])});
}
function tick(){clearInterval(window._ti);const tot=(CFG.minutes||25)*60;window._ti=setInterval(()=>{if(!S.start)return;let left=tot-Math.floor((Date.now()-S.start)/1000);if(left<0)left=0;$("timer").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");$("timer").style.color=left<120?"var(--bad)":""},500)}
function hint(){const i=CFG.objects.findIndex((o,k)=>!S.solved[k]);S.hints++;save();if(i<0){toast("Все испытания пройдены! Нажми на дверь и введи код.");return}toast("Подсказка: «"+CFG.objects[i].name+"» — "+CFG.objects[i].hint)}
let cur=null;
function openObj(i){
  const o=CFG.objects[i];cur={i,o,state:o.tasks.map(()=>({}))};
  let h='<h2>'+esc(o.name)+'</h2><div class="story">'+o.story+'</div>';
  if(S.solved[i]){h+='<p>Это испытание уже пройдено. Найденный символ:</p><div class="digit">'+esc(o.digit)+'</div><div class="actions"><button class="btn primary" onclick="closeOv()">Закрыть</button></div>';show(h);return}
  o.tasks.forEach((t,k)=>{h+='<div class="q" id="q'+k+'"><p>'+t.q+'</p>'+renderTask(t,k)+'</div>'});
  h+='<div class="fb" id="fb"></div><div class="actions"><button class="btn" onclick="closeOv()">Отложить</button><button class="btn primary" id="chk" onclick="check()">Проверить</button></div>';
  show(h);
}
function renderTask(t,k){
  if(t.type==="mcq"||t.type==="multi")return '<div class="opts">'+t.options.map((op,j)=>'<button class="opt" data-k="'+k+'" data-j="'+j+'" onclick="pick(this)">'+op+'</button>').join("")+'</div>'+(t.type==="multi"?'<small style="color:var(--muted)">Можно выбрать несколько вариантов</small>':"");
  if(t.type==="input")return '<input type="text" id="in'+k+'" placeholder="'+(t.placeholder||"Ответ")+'" autocomplete="off">';
  if(t.type==="match")return t.pairs.map((p,j)=>'<div class="row"><span>'+p[0]+'</span><select id="m'+k+'_'+j+'"><option value="">— выбери —</option>'+shuffled(t.pairs.map(x=>x[1]),k*7+3).map(v=>'<option>'+v+'</option>').join("")+'</select></div>').join("");
  if(t.type==="sort")return '<div class="sortgrid">'+t.items.map((it,j)=>'<div class="sortitem"><span>'+it[0]+'</span><span class="tg">'+t.groups.map((g,gi)=>'<button data-k="'+k+'" data-j="'+j+'" data-g="'+gi+'" onclick="sortPick(this)">'+g+'</button>').join("")+'</span></div>').join("")+'</div>';
  if(t.type==="order"){const ord=shuffled(t.items.map((x,j)=>j),k*11+5);return '<div class="orderlist">'+ord.map(j=>'<button class="opt" data-k="'+k+'" data-j="'+j+'" onclick="orderPick(this)">'+t.items[j]+'</button>').join("")+'</div><small style="color:var(--muted)">Нажимай по порядку. Нажми ещё раз, чтобы отменить.</small>'}
  if(t.type==="fill")return t.items.map((it,j)=>'<div class="row"><span>'+it.text+'</span><select id="f'+k+'_'+j+'"><option value="">— выбери —</option>'+it.options.map(v=>'<option>'+v+'</option>').join("")+'</select></div>').join("");
  return "";
}
function shuffled(a,seed){a=a.slice();let s=seed||1;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(b){const k=+b.dataset.k,t=cur.o.tasks[k];const st=cur.state[k];if(t.type==="mcq"){document.querySelectorAll('#q'+k+' .opt').forEach(x=>x.classList.remove("sel"));b.classList.add("sel");st.v=+b.dataset.j}else{b.classList.toggle("sel");st.v=[...document.querySelectorAll('#q'+k+' .opt.sel')].map(x=>+x.dataset.j)}}
function sortPick(b){const k=+b.dataset.k,j=+b.dataset.j;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");(cur.state[k].v=cur.state[k].v||{})[j]=+b.dataset.g}
function orderPick(b){const k=+b.dataset.k,j=+b.dataset.j,st=cur.state[k];st.v=st.v||[];const p=st.v.indexOf(j);if(p>=0){st.v.splice(p,1)}else st.v.push(j);document.querySelectorAll('#q'+k+' .opt').forEach(x=>{const q=st.v.indexOf(+x.dataset.j);x.innerHTML=(q>=0?'<span class="n">'+(q+1)+'</span>':"")+cur.o.tasks[k].items[+x.dataset.j];x.classList.toggle("sel",q>=0)})}
function evalTask(t,k){
  const st=cur.state[k];
  if(t.type==="mcq")return st.v===t.answer;
  if(t.type==="multi"){const v=(st.v||[]).slice().sort().join(),a=t.answer.slice().sort().join();return v===a}
  if(t.type==="input"){const v=norm($("in"+k).value);return t.answer.map(norm).includes(v)}
  if(t.type==="match")return t.pairs.every((p,j)=>$("m"+k+"_"+j).value===p[1]);
  if(t.type==="sort")return t.items.every((it,j)=>st.v&&st.v[j]===it[1]);
  if(t.type==="order")return (st.v||[]).length===t.items.length&&st.v.every((x,j)=>x===j);
  if(t.type==="fill")return t.items.every((it,j)=>$("f"+k+"_"+j).value===it.answer);
}
function check(){
  const o=cur.o;let allOk=true;const msgs=[];
  o.tasks.forEach((t,k)=>{const ok=evalTask(t,k);const q=$("q"+k);q.style.borderColor=ok?"var(--ok)":"var(--bad)";if(!ok){allOk=false;msgs.push(t.explain)}
    if(t.type==="mcq"||t.type==="multi"){document.querySelectorAll('#q'+k+' .opt').forEach(x=>{x.classList.remove("right","wrong");const j=+x.dataset.j;const isA=t.type==="mcq"?j===t.answer:t.answer.includes(j);if(x.classList.contains("sel"))x.classList.add(isA?"right":"wrong")})}
  });
  const fb=$("fb");
  if(allOk){S.solved[cur.i]=true;save();render();fb.className="fb ok";fb.innerHTML='<b>Верно!</b> '+(o.success||"")+'<div style="text-align:center"><div class="digit">'+esc(o.digit)+'</div><div style="color:var(--muted);font-size:13px">Символ добавлен в '+(CFG.codeLabel||"код двери").toLowerCase()+'</div></div>';$("chk").textContent="Дальше";$("chk").onclick=closeOv;
    if(Object.keys(S.solved).length===CFG.objects.length)setTimeout(()=>toast(CFG.allDoneMsg||"Все символы собраны! Иди к двери."),600)}
  else{fb.className="fb no";fb.innerHTML='<b>Пока не всё верно.</b> Исправь отмеченные красным задания.<br>'+msgs.map(m=>"• "+m).join("<br>")}
}
function openDoor(){
  const n=Object.keys(S.solved).length,t=CFG.objects.length;
  let h='<h2>'+esc(CFG.door.name)+'</h2><div class="story">'+CFG.door.story+'</div>';
  if(n<t){h+='<p>Собрано символов: <b>'+n+' из '+t+'</b>. Исследуй комнату дальше — светящиеся предметы хранят испытания.</p><div class="actions"><button class="btn primary" onclick="closeOv()">Вернуться</button></div>';show(h);return}
  h+='<p>Введи символы в том порядке, в каком они стоят внизу экрана.</p><div class="codeIn">'+CFG.objects.map((o,i)=>'<input type="text" maxlength="'+String(o.digit).length+'" id="c'+i+'">').join("")+'</div><div class="fb" id="fb"></div><div class="actions"><button class="btn" onclick="closeOv()">Назад</button><button class="btn primary" onclick="tryCode()">Открыть</button></div>';
  show(h);
  const ins=CFG.objects.map((o,i)=>$("c"+i));ins.forEach((el,i)=>el.oninput=()=>{if(el.value.length>=el.maxLength&&ins[i+1])ins[i+1].focus()});ins[0].focus();
}
function tryCode(){const ok=CFG.objects.every((o,i)=>norm($("c"+i).value)===norm(o.digit));const fb=$("fb");if(ok){closeOv();win()}else{fb.className="fb no";fb.textContent="Замок не поддаётся. Проверь порядок символов внизу экрана."}}
function win(){
  const sec=S.start?Math.floor((Date.now()-S.start)/1000):0;clearInterval(window._ti);
  const f=$("final");f.style.backgroundImage="url("+IMG_ROOM+")";f.style.display="flex";
  $("fTitle").textContent=CFG.final.title;$("fSub").textContent="Время: "+Math.floor(sec/60)+" мин "+(sec%60)+" с · подсказок: "+S.hints;$("fTxt").innerHTML=CFG.final.text;
  const cols=[getComputedStyle(document.documentElement).getPropertyValue("--accent"),"#fff","#5fe3a1","#ffd166"];
  for(let i=0;i<90;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=cols[i%4];c.style.animationDuration=(2.5+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),6500)}
}
function restart(){S={solved:{},start:null,hints:0};save();location.reload()}
function show(h){$("modal").innerHTML=h;$("ov").classList.add("show")}
function closeOv(){$("ov").classList.remove("show")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeOv()});
init();
</script>
