<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Русский без ошибок — 5 класс</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#5513d7,#3210a8);font:17px/1.5 system-ui,sans-serif;color:#222;padding:22px}#app{max-width:980px;margin:auto;background:#fff;border-radius:25px;padding:clamp(15px,4vw,32px);min-height:80vh}header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:800}h1{font-size:clamp(43px,10vw,100px);line-height:.95;letter-spacing:-.07em;color:#5515cf;margin:35px 0 18px;font-weight:950}h2{font-size:clamp(24px,4vw,35px);line-height:1.1}h3{font-size:21px}button{cursor:pointer;border:0;border-radius:30px;padding:12px 18px;background:#6819f7;color:white;font:700 15px system-ui;min-height:44px}button.alt{background:#f1f0f5;color:#292336}button.opt{display:block;width:100%;text-align:left;background:white;color:#222;border:2px solid #e4def4;margin:8px 0;border-radius:14px}button.opt:hover{border-color:#6819f7}.hero{position:relative;overflow:hidden;padding-bottom:20px}.hero p{max-width:480px;font-weight:650}.blob{position:absolute;right:7%;bottom:10px;width:105px;height:105px;background:radial-gradient(circle at 30% 25%,#ffdfb1,#ff8d3b 65%,#bd4518);border-radius:45% 55% 62% 38%;transform:rotate(-25deg);box-shadow:16px 10px 0 #b3fa65;pointer-events:none}.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.tile{border-radius:23px;padding:22px;min-height:130px}.orange{background:#ff924f;grid-row:span 2}.purple{background:#6819f7;color:#fff}.lime{background:#b6f76c}.gray{background:#f3f3f3}.tile strong{font-size:clamp(21px,3vw,32px);line-height:1.1;display:block}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0 20px}.chips button{font-size:12px;min-height:34px;padding:8px 13px}.chips button.alt{background:#eee}input{width:100%;font:inherit;border:2px solid #e4e1ee;background:#f7f7f8;border-radius:15px;padding:13px 15px;color:#222}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:145px;border-radius:20px;padding:17px;color:#222}.card:nth-child(4n+1){background:#eee6ff}.card:nth-child(4n+2){background:#f2f2f2}.card:nth-child(4n+3){background:#c6f68d}.card:nth-child(4n){background:#ffb581}.card strong{font-size:20px}.card small{font-size:12px;opacity:.7}.panel{background:#f5f4f7;border-radius:20px;padding:20px;margin:12px 0}.panel li{margin:9px 0}.answer{background:#ece4ff;border-radius:13px;padding:15px;margin:10px 0}.result{background:#dff8e8;border-radius:13px;padding:15px;margin:10px 0}.muted{font-size:13px;color:#65616b}.foot{text-align:center;font-size:12px;color:#777;margin-top:25px}@media(max-width:500px){body{padding:8px}.blob{width:65px;height:65px;opacity:.7}.tile{padding:15px}.card{min-height:135px;padding:13px}.card strong{font-size:16px}}
</style></head><body><main id="app"></main><script>
const topics=[
['Глаголы','-тся или -ться?','Если глагол отвечает на вопрос «что делать?» или «что сделать?», пишется -ться. Если «что делает?» или «что сделает?» — -тся.','Хочет учиться. Он учится.',['Найди глагол.','Задай вопрос.','Проверь мягкий знак в вопросе.','Выбери написание.'],['Что делать? — учиться.','Что делает? — учится.'],['Посмотри на вопрос.','Хочет (что делать?) учиться.','Частая ошибка: писать на слух.'],[['Он любит ...',['учится','учиться','учитьца'],1],['Девочка ...',['смеётся','смеёться','смеётца'],0],['Исправь «Он стараеться».','старается']]],
['Глаголы','НЕ с глаголами','НЕ с глаголами пишется раздельно, кроме глаголов, которые без НЕ не употребляются.','Не знал. Ненавидеть.',['Найди глагол.','Убери НЕ.','Проверь, существует ли слово.','Выбери написание.'],['«Знал» существует — не знал.','«Ненавидеть» без НЕ не употребляется.'],['Попробуй убрать НЕ.','Не читал — раздельно; негодовал — слитно.','Частая ошибка: «незнал».'],[['Как правильно?',['незнал','не знал','не-знал'],1],['Выбери слово.',['не навидеть','ненавидеть','не-навидеть'],1],['Исправь «нечитал».','не читал']]],
['Существительные','Ь после шипящих','У существительных женского рода с шипящей на конце пишется ь, мужского — нет.','Моя ночь. Мой врач.',['Найди существительное.','Определи род.','Подставь «моя» или «мой».','Выбери написание.'],['Моя мышь — с ь.','Мой нож — без ь.'],['Подставь «моя» или «мой».','Моя вещь — с ь; мой плащ — без ь.','Частая ошибка: «врачь».'],[['Как правильно?',['врачь','врач','врачъ'],1],['Выбери слово.',['ноч','ночъ','ночь'],2],['Исправь «карандашь».','карандаш']]],
['Гласные','Безударная гласная','Чтобы проверить безударную гласную в корне, подбери однокоренное слово, где она под ударением.','Вода — во́ды.',['Найди сомнительную гласную.','Подбери проверочное слово.','Поставь ударение.','Запиши букву.'],['Проверь общий корень.','Проверь ударение.'],['Сделай гласную ударной.','Леса — лес.','Частая ошибка: брать слово с другим корнем.'],[['В_да',['вада','вода','вида'],1],['Л_са (деревья)',['леса','лиса','ласа'],0],['Исправь «трова».','трава']]],
['Согласные','Парная согласная','Подбери слово, где после сомнительной согласной стоит гласная.','Дуб — дубы.',['Найди согласную.','Измени слово.','Проверь звук.','Напиши букву.'],['Дуб — дубы.','Гриб — грибы.'],['Поставь после согласной гласную.','Гриб — грибы.','Частая ошибка: писать по слуху.'],[['Выбери.',['дуп','дуб','дубь'],1],['Выбери.',['грип','гриб','грибп'],1],['Исправь «сапок».','сапог']]],
['Согласные','Непроизносимые согласные','Подбери однокоренное слово, где сомнительная согласная слышна отчётливо.','Честный — честь.',['Найди сочетание.','Подбери проверочное слово.','Проверь звук.','Напиши слово.'],['Честный — честь.','Опасный — опасен.'],['Найди слово с отчётливым звуком.','Поздний — опоздать.','Частая ошибка: добавлять лишнюю т.'],[['Выбери.',['чесный','честный','честнный'],1],['Выбери.',['опасный','опастный','опасстный'],0],['Исправь «позний».','поздний']]],
['Приставки','З или С в приставке','В приставках на з/с перед звонким согласным пишется з, перед глухим — с. Приставка с- всегда пишется с.','Разбить — расписать.',['Найди приставку.','Определи следующий звук.','Проверь звонкость.','Выбери букву.'],['Б — звонкий.','П — глухой.'],['Посмотри на первый звук корня.','Разбить, расписать.','Частая ошибка: менять с- на з-.'],[['Выбери.',['расписать','разписать','расписсатъ'],0],['Выбери.',['расбить','разбить','разпить'],1],['Исправь «бесвкусный».','безвкусный']]],
['Приставки','Ъ или Ь?','После приставки на согласную перед е, ё, ю, я пишется разделительный ъ. В других случаях может требоваться разделительный ь.','Подъезд. Семья.',['Найди знак.','Проверь приставку.','Посмотри следующую букву.','Выбери ъ или ь.'],['Подъезд — после приставки.','Семья — внутри слова.'],['Найди приставку.','Объявление, вьюга.','Частая ошибка: «подьезд».'],[['Выбери.',['подьезд','подъезд','подезд'],1],['Выбери.',['семъя','семя','семья'],2],['Исправь «обьявление».','объявление']]],
['Существительные','Как определить падеж?','Падеж существительного определяют по вопросу и его связи с другими словами в предложении.','Нет (чего?) книги — родительный.',['Найди существительное.','Найди главное слово.','Задай вопрос.','Назови падеж.'],['Нет чего? — родительный.','Помогаю кому? — дательный.'],['Задай вопрос от другого слова.','Помогаю другу — дательный.','Частая ошибка: определять только по окончанию.'],[['Нет книги.',['Именительный','Родительный','Дательный'],1],['Помогаю другу.',['Дательный','Творительный','Винительный'],0],['Горжусь братом. Какой падеж?','творительный']]],
['Прилагательные','Окончания прилагательных','Прилагательное согласуется с существительным в роде, числе и падеже.','В синем море.',['Найди существительное.','Задай вопрос.','Определи форму.','Выбери окончание.'],['В каком море?','С какой картиной?'],['Смотри на существительное.','С красивой картиной.','Частая ошибка: не учитывать падеж.'],[['В син... море',['синим','синем','синём'],1],['С красив... картиной',['красивой','красивым','красивого'],0],['Исправь «к новому школе». Напиши прилагательное.','новой']]],
['Предложения','Однородные члены','Между однородными членами без союзов ставят запятую. Перед одиночным и между двумя однородными членами запятая обычно не нужна. Перед а ставят запятую.','Яблоки, груши и сливы.',['Найди однородные члены.','Проверь союзы.','Определи перечисление.','Поставь запятые.'],['Проверь союз и.','Проверь союз а.'],['Найди перечисление.','Книги, тетради и ручки.','Частая ошибка: лишняя запятая перед и.'],[['Выбери.',['Яблоки, груши и сливы','Яблоки груши и сливы','Яблоки, груши, и сливы'],0],['Выбери.',['Маша, и Петя','Маша и Петя','Маша и, Петя'],1],['Выбери.',['Не большой а маленький','Не большой, а маленький','Не, большой а маленький'],1]]],
['Предложения','Обращения','Обращение называет того, к кому обращаются с речью. На письме выделяется запятыми.','Мама, посмотри!',['Найди, к кому обращаются.','Определи обращение.','Найди его границы.','Поставь запятые.'],['К кому обращаются?','Проверь границы обращения.'],['Найди адресата речи.','Ребята, откройте книги.','Частая ошибка: путать обращение с подлежащим.'],[['Выбери.',['Мама посмотри','Мама, посмотри','Мама посмотри,'],1],['Выбери.',['Спасибо друг','Спасибо, друг','Спасибо друг,'],1],['Выбери.',['Ребята откройте книги','Ребята, откройте книги','Ребята откройте, книги'],1]]]
];
const app=document.getElementById('app');let filter='Все',search='',idx=0,level=1,step=0,score=0,tries=0,locked=false,order=[];const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[.!?]+$/,'').trim().replace(/\s+/g,' ');const E=(tag,cls,html)=>{let e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};const B=(label,fn,cls='')=>{let e=E('button',cls);e.textContent=label;e.onclick=fn;return e};function head(){let e=E('header','','<div>🟠 РУССКИЙ<br>БЕЗ ОШИБОК</div>');e.appendChild(B('Все темы ↗',home,'alt'));return e}
function home(){app.innerHTML='';app.appendChild(head());app.appendChild(E('div','hero','<h1>РУССКИЙ<br>БЕЗ ОШИБОК</h1><p>Твоя интерактивная база знаний. Находи ошибки, разбирай правила и тренируйся.</p><div class="blob"></div>'));app.appendChild(E('div','bento','<div class="tile orange"><small>ТВОЯ БАЗА ЗНАНИЙ ✳</small><h2>Ошибаться можно.<br>Не разобраться — обидно!</h2></div><div class="tile gray"><strong>12 тем<br>в одном месте</strong><p>От глаголов до пунктуации</p></div><div class="tile lime"><strong>36 заданий ↗</strong><p>Проверяй себя сразу</p></div><div class="tile purple" style="grid-column:1/-1"><strong>Забыл правило? Найдём за минуту ✳</strong></div>'));app.appendChild(E('h2','','Выбери свою ошибку ↗'));let inp=E('input');inp.placeholder='Поиск: -ться, запятая, падеж…';inp.value=search;inp.oninput=e=>{search=e.target.value;draw()};app.appendChild(inp);let chips=E('div','chips');app.appendChild(chips);['Все','Глаголы','Существительные','Гласные','Согласные','Приставки','Прилагательные','Предложения'].forEach(c=>chips.appendChild(B(c,()=>{filter=c;home()},filter===c?'':'alt')));let cards=E('div','cards');cards.id='cards';app.appendChild(cards);draw();let box=E('div','panel','<h3>Для учителя ✳</h3><p>Ответы и источники правил</p>');box.appendChild(B('Открыть ответы ↗',teacher));app.appendChild(box);app.appendChild(E('div','foot','РУССКИЙ БЕЗ ОШИБОК · 5 КЛАСС'))}
function draw(){let c=document.getElementById('cards');if(!c)return;c.innerHTML='';topics.forEach((t,i)=>{if(filter!=='Все'&&t[0]!==filter)return;if(!norm(t[0]+' '+t[1]+' '+t[2]).includes(norm(search)))return;let card=B('',()=>topic(i),'card');card.innerHTML='<small>№ '+String(i+1).padStart(2,'0')+' / '+t[0]+'</small><strong>'+t[1]+'</strong><span style="text-align:right;font-size:25px">↗</span>';c.appendChild(card)});if(!c.children.length)c.appendChild(E('p','','Ничего не найдено.'))}
function topic(i){idx=i;level=1;let t=topics[i];app.innerHTML='';app.appendChild(head());app.appendChild(B('← К библиотеке',home,'alt'));app.appendChild(E('div','tile purple','<small>'+t[0]+' · ТЕМА '+(i+1)+'</small><h2 style="font-size:clamp(29px,6vw,48px)">'+t[1]+'</h2><p>Разберись и проверь себя ✳</p>'));app.appendChild(E('div','panel','<h3>01 / Главное правило</h3><p>'+t[2]+'</p><div class="answer"><b>Пример:</b> '+t[3]+'</div>'));app.appendChild(E('div','panel','<h3>02 / Порядок действий</h3><ol>'+t[4].map(x=>'<li>'+x+'</li>').join('')+'</ol>'));app.appendChild(E('div','panel','<h3>03 / Самопроверка</h3><ul>'+t[5].map(x=>'<li>'+x+'</li>').join('')+'</ul>'));app.appendChild(E('div','panel','<h3>04 / Если не получается</h3><div id="help"></div>'));showHelp();let train=E('div','tile lime','<h2>05 / Время потренироваться!</h2><p>Три задания с проверкой ответа</p><div id="train"></div>');app.appendChild(train);document.getElementById('train').appendChild(B('Начать ↗',()=>start(false)));app.appendChild(E('p','muted',i<3?'Источник: текст правила предоставлен учителем.':'Источник: общие знания; сверьте с учебником.'))}
function showHelp(){let c=document.getElementById('help');c.innerHTML=topics[idx][6].slice(0,level).map((x,i)=>'<div class="answer"><b>Ступень '+(i+1)+'</b><div>'+x+'</div></div>').join('');if(level<3)c.appendChild(B('Ещё подсказка ↗',()=>{level++;showHelp()},'alt'))}
function start(shuffle){step=0;score=0;order=[0,1,2];if(shuffle)order.sort(()=>Math.random()-.5);task()}
function task(){tries=0;locked=false;let t=topics[idx][7][order[step]],c=document.getElementById('train');c.innerHTML='<p><b>Задание '+(step+1)+' / 3</b></p><h3>'+t[0]+'</h3>';if(Array.isArray(t[1])){[0,1,2].sort(()=>Math.random()-.5).forEach(j=>c.appendChild(B(t[1][j],()=>judge(j),'opt')))}else{let inp=E('input');inp.placeholder='Твой ответ';c.appendChild(inp);c.appendChild(B('Проверить',()=>judge(inp.value)));inp.onkeydown=e=>{if(e.key==='Enter')judge(inp.value)}}let f=E('div');f.id='feedback';c.appendChild(f)}
function judge(v){if(locked)return;if(typeof v==='string'&&!v.trim())return;let t=topics[idx][7][order[step]],ok=Array.isArray(t[1])?v===t[2]:norm(v)===norm(t[1]),f=document.getElementById('feedback');f.innerHTML='';if(ok){locked=true;if(!tries)score++;f.appendChild(E('div','result','<b>Верно!</b> '+(Array.isArray(t[1])?t[1][t[2]]:t[1])));f.appendChild(B(step===2?'Итог ↗':'Дальше ↗',next))}else{tries++;if(tries<2)f.appendChild(E('div','answer','Попробуй ещё раз. Вспомни правило выше.'));else{locked=true;f.appendChild(E('div','answer','<b>Правильный ответ:</b> '+(Array.isArray(t[1])?t[1][t[2]]:t[1])));f.appendChild(B(step===2?'Итог ↗':'Дальше ↗',next))}}}
function next(){step++;if(step<3)task();else{let c=document.getElementById('train');c.innerHTML='<h2>Готово! ✳</h2><p>С первой попытки: <b>'+score+' из 3</b></p>';c.appendChild(B('Повторить',()=>start(true)));c.appendChild(B('Другие темы',home,'alt'))}}
function teacher(){app.innerHTML='';app.appendChild(head());app.appendChild(B('← Назад',home,'alt'));app.appendChild(E('div','tile purple','<h2>Для учителя ✳</h2><p>Ответы на все задания</p>'));app.appendChild(E('div','panel','Первые три темы — по правилам, присланным учителем. Остальные — по общим знаниям, требуют сверки с учебником.'));topics.forEach((t,i)=>app.appendChild(E('div','panel','<h3>'+(i+1)+'. '+t[1]+'</h3><ol>'+t[7].map(q=>'<li>'+q[0]+'<div><b>Ответ: '+(Array.isArray(q[1])?q[1][q[2]]:q[1])+'</b></div></li>').join('')+'</ol>')))}home();
</script></body></html>
