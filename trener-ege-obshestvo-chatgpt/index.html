<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЕГЭ 2027 — Обществознание</title>
<style>
:root{color-scheme:light;--bg:#eaecdf;--card:#ffffff;--soft:#f6f7f7;--line:#e2e4d8;--text:#0b0b0b;--muted:#6d7066;--lime:#c6ef4e;--black:#000}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#b9bcae;color:var(--text);font:15px/1.5 "Atyp Display","Atyp Text","Manrope","Inter","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 16px 40px}
main{position:relative;max-width:1120px;margin:auto;background-color:var(--bg);background-image:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px);background-size:22px 22px;border-radius:34px;padding:22px 26px 30px 116px;box-shadow:0 30px 60px #0000001f}
main::before{content:"";position:absolute;left:16px;top:16px;bottom:16px;width:68px;background:var(--black);border-radius:24px}
main::after{content:"";position:absolute;left:33px;top:36px;width:26px;height:26px;border:4px solid var(--lime);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
header,.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{margin:6px 0 22px;padding-bottom:16px;border-bottom:1px solid #d6d8cb}
.brand{font-weight:700;font-size:26px;letter-spacing:-.01em;text-transform:none}
.brand span{color:var(--muted)!important;font-weight:500}
.tag,.pill{background:var(--card);border:1px solid #dcdecf;border-radius:30px;padding:6px 14px;font-size:12px;color:#333}
.card{background:var(--card);border:0;border-radius:24px;padding:24px 26px;margin:16px 0;box-shadow:0 1px 0 #0000000a}
.card.hero{background:var(--lime)}
.card.hero h2{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.02em;max-width:640px}
.card.hero .muted{color:#1f2a00}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}
h2{font-size:21px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:18px;margin:10px 0}
p{margin:10px 0 15px}
.muted,small{color:var(--muted)}
button{background:var(--card);border:1px solid #d9dbcf;color:var(--text);border-radius:999px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
button.primary{background:var(--black);border-color:var(--black);color:#fff}
button.secondary{background:transparent;color:#777}
button:hover{border-color:#000}
button.primary:hover{background:#222}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #000;outline-offset:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
a{color:var(--text);cursor:pointer;font-weight:600}
.foot{margin-top:30px;padding-top:18px;border-top:1px solid #d6d8cb}
.notice{padding:12px 16px;background:var(--soft);border-left:4px solid var(--lime);border-radius:12px;margin:14px 0}
.error{border-left-color:#e5484d;background:#fdeeee}
.success{border-left-color:#7fb800;background:#f2fbd8}
.options{display:grid;gap:8px;margin:18px 0}
.option{display:flex;gap:12px;padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:14px}
.option b{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;background:var(--black);color:var(--lime);font-size:13px}
.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:18px 0}
.columns>div{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:15px}
.columns p{margin:7px 0}
.answer{width:100%;max-width:440px;background:var(--soft);color:var(--text);border:1px solid #d9dbcf;border-radius:999px;padding:13px 20px;font:600 20px/1.2 inherit;font-family:inherit;letter-spacing:3px}
textarea{width:100%;min-height:230px;background:var(--soft);color:var(--text);border:1px solid #d9dbcf;border-radius:16px;padding:14px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
select{background:var(--soft);color:var(--text);border:1px solid #d9dbcf;border-radius:999px;padding:10px 14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;border-bottom:1px solid #eceee5;padding:12px 10px}
th{color:var(--muted);font-weight:500;font-size:13px}
.scroll{overflow-x:auto}
.wheel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 20px;margin:18px 0}
.wheelHead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:6px;font-weight:600;font-size:17px}
.legend{display:flex;gap:14px;font-size:12px;font-weight:500;color:#333}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lime)}
.lg.prev::before{background:transparent;border:1.5px solid #000;width:7px;height:7px}
.wheel svg{display:block;width:100%;max-width:640px;margin:auto}
.sectionPick{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sectionPick button{font-size:13px;padding:8px 14px}
.sectionPick button.active{background:var(--black);color:#fff;border-color:#000}
.stats{display:flex;gap:10px;flex-wrap:wrap}
#view{min-height:320px}
@media(max-width:700px){
body{padding:0}
main{border-radius:0;padding:76px 14px 40px}
main::before{left:0;right:0;top:0;bottom:auto;width:auto;height:58px;border-radius:0}
main::after{left:18px;top:15px}
.card{padding:18px}
.columns{grid-template-columns:1fr}
.wheel{padding:12px 8px}
th,td{padding:8px 6px;font-size:12px}
button{padding:11px 16px}
}
p.pill{display:inline-block;background:var(--black);color:var(--lime);border-color:#000;margin:0 0 6px;font-weight:600}
.answer::placeholder{letter-spacing:0;font-weight:400;font-size:.8em}
</style>
</head>
<body>
<main>
<header>
<div class="brand">Обществознание <span>· ЕГЭ</span></div>
<span class="tag">ПРОЕКТ 2027</span>
</header>
<div id="warning"></div>
<div id="view"></div>
<footer class="foot">
<span class="muted">Учебный тренажёр · работает без интернета</span>
<a href="#teacher" id="teacherLink">Для учителя</a>
</footer>
</main>

<script id="bank" type="application/json">{"spec":{"exam":"ЕГЭ 2027, обществознание","sections":[{"id":"S1","name":"Человек в обществе. Духовная культура","short":"Человек и культура"},{"id":"S2","name":"Экономика","short":"Экономика"},{"id":"S3","name":"Социальная сфера","short":"Социальная сфера"},{"id":"S4","name":"Политика","short":"Политика"},{"id":"S5","name":"Право","short":"Право"}],"topics":[{"id":"S1.T1","sectionId":"S1","name":"Человек и личность"},{"id":"S1.T2","sectionId":"S1","name":"Познание и истина"},{"id":"S1.T3","sectionId":"S1","name":"Общество и развитие"},{"id":"S1.T4","sectionId":"S1","name":"Духовная культура и мораль"},{"id":"S1.T5","sectionId":"S1","name":"Наука и образование"},{"id":"S1.T6","sectionId":"S1","name":"Религия и искусство"},{"id":"S2.T1","sectionId":"S2","name":"Экономика и экономические системы"},{"id":"S2.T2","sectionId":"S2","name":"Рынок и конкуренция"},{"id":"S2.T3","sectionId":"S2","name":"Фирма и предпринимательство"},{"id":"S2.T4","sectionId":"S2","name":"Финансы и банки"},{"id":"S2.T5","sectionId":"S2","name":"Государство, налоги и рынок труда"},{"id":"S2.T6","sectionId":"S2","name":"Экономический рост и мировая экономика"},{"id":"S3.T1","sectionId":"S3","name":"Социальные группы и мобильность"},{"id":"S3.T2","sectionId":"S3","name":"Этнические общности и межнациональные отношения"},{"id":"S3.T3","sectionId":"S3","name":"Социальные статусы и роли"},{"id":"S3.T4","sectionId":"S3","name":"Семья и социализация"},{"id":"S3.T5","sectionId":"S3","name":"Социальные нормы и контроль"},{"id":"S3.T6","sectionId":"S3","name":"Социальные конфликты"},{"id":"S4.T1","sectionId":"S4","name":"Политическая система"},{"id":"S4.T2","sectionId":"S4","name":"Государство и его формы"},{"id":"S4.T3","sectionId":"S4","name":"Государственная власть РФ"},{"id":"S4.T4","sectionId":"S4","name":"Политическое участие"},{"id":"S4.T5","sectionId":"S4","name":"Избирательные системы"},{"id":"S4.T6","sectionId":"S4","name":"Лидерство и СМИ"},{"id":"S5.T1","sectionId":"S5","name":"Система права"},{"id":"S5.T2","sectionId":"S5","name":"Конституционные права"},{"id":"S5.T3","sectionId":"S5","name":"Гражданское право"},{"id":"S5.T4","sectionId":"S5","name":"Семейное право"},{"id":"S5.T5","sectionId":"S5","name":"Налоговое и образовательное право"},{"id":"S5.T6","sectionId":"S5","name":"Юридическая ответственность"}],"taskRules":[{"ege":1,"type":"set","scoring":"all1","maxPoints":1},{"ege":2,"type":"set","scoring":"set2","maxPoints":2},{"ege":3,"type":"match","scoring":"exact1","maxPoints":1},{"ege":4,"type":"set","scoring":"set2","maxPoints":2},{"ege":5,"type":"set","scoring":"set2","maxPoints":2},{"ege":6,"type":"match","scoring":"match2","maxPoints":2},{"ege":7,"type":"set","scoring":"set2","maxPoints":2},{"ege":8,"type":"set","scoring":"set2","maxPoints":2},{"ege":9,"type":"set","scoring":"all1","maxPoints":1},{"ege":10,"type":"set","scoring":"set2","maxPoints":2},{"ege":11,"type":"set","scoring":"set2","maxPoints":2},{"ege":12,"type":"set","scoring":"all1","maxPoints":1},{"ege":13,"type":"match","scoring":"match2","maxPoints":2},{"ege":14,"type":"set","scoring":"set2","maxPoints":2},{"ege":15,"type":"match","scoring":"match2","maxPoints":2},{"ege":16,"type":"set","scoring":"set2","maxPoints":2}]},"questions":[{"id":"S1-01","sectionId":"S1","topicId":"S1.T3","ege":2,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальных изменениях и запишите цифры, под которыми они указаны.","options":["Один из критериев социального прогресса – возрастание степени свободы, которую общество может предоставить человеку.","Социальные изменения происходят в течение некоторого времени внутри социальных систем и во взаимоотношениях между ними, в обществе в целом.","В современном обществе критерием общественного прогресса принято считать прежде всего отсутствие инфляции в экономике.","Общественный прогресс в одних областях исключает деградацию в других.","Реформа предполагает постепенные изменения элементов общественной жизни."],"answer":"125","explanation":"1 — верно: расширение свободы личности может служить критерием прогресса. 2 — верно: социальные изменения затрагивают общественные системы и отношения. 5 — верно: реформа предполагает постепенное преобразование отдельных сторон общественной жизни. 3 — неверно: отсутствие инфляции не является универсальным критерием общественного прогресса. 4 — неверно: прогресс противоречив, развитие одной сферы может сопровождаться регрессом в другой.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 2"},{"id":"S2-02","sectionId":"S2","topicId":"S2.T5","ege":5,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о безработице и её видах (типах) и запишите цифры, под которыми они указаны.","options":["Отсутствие у безработных информации о подходящих им вакансиях может быть причиной фрикционной безработицы.","Сезонная безработица характерна для периода экономического кризиса, она возникает в результате спада производства.","Безработица приводит к снижению дохода семьи, потере квалификации работником.","Циклическая безработица связана с низким профессиональным уровнем работников.","Безработицей называют социально-экономическое явление, при котором часть трудоспособного населения, желающая трудиться, не может найти себе работу."],"answer":"135","explanation":"1 — верно: недостаток информации о вакансиях может затруднять поиск работы. 3 — верно: безработица может снижать семейные доходы и приводить к утрате профессиональных навыков. 5 — верно: это характеристика безработицы как социально-экономического явления. 2 — неверно: спад производства во время кризиса связан прежде всего с циклической безработицей. 4 — неверно: циклическая безработица обусловлена экономическими колебаниями, а не низкой квалификацией работников.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 5"},{"id":"S3-02","sectionId":"S3","topicId":"S3.T1","ege":8,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальной стратификации и социальной мобильности и запишите цифры, под которыми они указаны.","options":["Социальная стратификация отражает разделение общества на слои, занимающие различное положение в социальной иерархии.","Вертикальная социальная мобильность всегда предполагает перемещение человека исключительно вверх по социальной лестнице.","Получение работником более высокой должности может служить примером восходящей социальной мобильности.","Горизонтальная социальная мобильность обязательно сопровождается изменением социального статуса на более высокий.","Социальное неравенство может проявляться в различиях доступа людей к экономическим ресурсам и власти."],"answer":"135","explanation":"1 — верно: социальная стратификация описывает иерархическое расслоение общества. 3 — верно: повышение в должности может означать восходящую мобильность. 5 — верно: неравенство проявляется в различиях доходов, власти и возможностей. 2 — неверно: вертикальная мобильность бывает восходящей и нисходящей. 4 — неверно: горизонтальная мобильность не предполагает повышения положения в социальной иерархии.","source":"Авторское задание по образцу задания 8"},{"id":"S4-01","sectionId":"S4","topicId":"S4.T1","ege":10,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о политической системе общества и запишите цифры, под которыми они указаны.","options":["В политической системе определяются цели и задачи общественного развития, разрабатывается политический курс власти.","Политологи различают мажоритарные и пропорциональные типы политических систем общества.","Социальные нормы (правовые, политические, нравственные и т.п.) относятся к институциональной (организационной) подсистеме политической системы общества.","Один из элементов нормативной подсистемы политической системы общества – политическая психология.","Политическая система общества регулирует политический процесс."],"answer":"15","explanation":"1 — верно: политическая система участвует в определении целей общественного развития. 5 — верно: регулирование политического процесса является одной из её функций. 2 — неверно: мажоритарная и пропорциональная системы относятся к избирательным системам. 3 — неверно: социальные нормы относятся к нормативной подсистеме. 4 — неверно: политическая психология относится к культурно-идеологической подсистеме.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 10"},{"id":"S5-02","sectionId":"S5","topicId":"S5.T4","ege":16,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Накануне официальной регистрации брака совершеннолетние граждане Российской Федерации Инна и Антон решили заключить брачный договор. Найдите в приведённом списке позиции, связанные с формой и возможным содержанием брачного договора в Российской Федерации, и запишите цифры, под которыми они указаны.","options":["распределение домашних обязанностей","нотариальное удостоверение","занятость и трудоустройство супругов","письменное оформление договора","способы участия в доходах друг друга","место жительства детей в случае развода родителей"],"answer":"245","explanation":"2 — верно: брачный договор подлежит нотариальному удостоверению. 4 — верно: он заключается в письменной форме. 5 — верно: супруги могут определить способы участия в доходах друг друга. 1 — неверно: распределение домашних обязанностей относится к личным неимущественным отношениям. 3 — неверно: вопросы занятости и трудоустройства супругов не являются предметом брачного договора. 6 — неверно: брачный договор не регулирует права и обязанности супругов в отношении детей.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 16"},{"id":"S1-02","sectionId":"S1","topicId":"S1.T3","ege":4,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"В стране Z компьютерные технологии широко используются в различных сферах общественной жизни. Какие иные признаки из перечисленных свидетельствуют о том, что страна Z развивается как постиндустриальное общество? Запишите цифры, под которыми они указаны.","options":["активное развитие цифровых коммуникаций","увеличение количества городов","разработка трудового законодательства","отсутствие условий для социальной мобильности","возрастание роли знаний и информации как фактора производства","преобладание сферы услуг в структуре экономики"],"answer":"156","explanation":"1 — верно: цифровые коммуникации характерны для информационного общества. 5 — верно: знания и информация становятся важнейшими факторами производства. 6 — верно: в структуре экономики преобладает сфера услуг. 2 — неверно: урбанизация характерна не только для постиндустриального общества. 3 — неверно: трудовое законодательство существует в обществах разных типов. 4 — неверно: отсутствие социальной мобильности не является признаком постиндустриального общества.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 4"},{"id":"S1-03","sectionId":"S1","topicId":"S1.T1","ege":2,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о человеке как личности и его деятельности и запишите цифры, под которыми они указаны.","options":["Формирование личности происходит под влиянием социокультурных факторов.","Потребности человека ограничиваются исключительно биологическими нуждами.","Мотивы побуждают человека к деятельности.","Любая деятельность человека осуществляется без постановки цели.","Мировоззрение влияет на отношение человека к окружающему миру и собственным поступкам."],"answer":"135","explanation":"1 — верно: личность формируется в обществе и культуре. 3 — верно: мотив выступает побуждением к деятельности. 5 — верно: мировоззрение определяет взгляды и ценностные ориентиры человека. 2 — неверно: существуют также социальные и духовные потребности. 4 — неверно: деятельность предполагает целеполагание.","source":"Авторское задание по образцу задания 2"},{"id":"S1-04","sectionId":"S1","topicId":"S1.T2","ege":3,"role":"practice","type":"match","scoring":"exact1","maxPoints":1,"text":"Установите соответствие между примерами познавательных процессов и формами познания: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) восприятие человеком аромата цветка","Б) формирование понятия «социальный институт»","В) зрительное восприятие цвета предмета","Г) умозаключение на основе нескольких суждений","Д) формирование суждения о причинах общественного явления"],"right":["1) чувственное познание","2) рациональное познание"],"answer":"12122","explanation":"А — 1: ощущение запаха относится к чувственному познанию. Б — 2: понятие является формой рационального познания. В — 1: восприятие цвета осуществляется органами чувств. Г — 2: умозаключение является формой мышления. Д — 2: суждение относится к рациональному познанию.","source":"Авторское задание по образцу задания 3"},{"id":"S1-05","sectionId":"S1","topicId":"S1.T4","ege":2,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о духовной культуре и морали и запишите цифры, под которыми они указаны.","options":["Мораль регулирует поведение людей с опорой на представления о добре и зле.","Массовая культура предназначена исключительно для узкого круга профессиональных ценителей.","Произведения народной культуры могут передаваться от поколения к поколению.","Все моральные нормы обязательно закрепляются в нормативных правовых актах.","Культура выполняет функцию передачи социального опыта.","Элитарная культура всегда создаётся анонимными авторами."],"answer":"135","explanation":"1 — верно: мораль связана с нравственными оценками поступков. 3 — верно: традиции и произведения народной культуры могут передаваться между поколениями. 5 — верно: культура обеспечивает сохранение и передачу социального опыта. 2 — неверно: массовая культура ориентирована на широкую аудиторию. 4 — неверно: моральные нормы не обязательно закреплены законом. 6 — неверно: анонимность авторства не является обязательным признаком элитарной культуры.","source":"Авторское задание по образцу задания 2"},{"id":"S1-06","sectionId":"S1","topicId":"S1.T5","ege":4,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"В стране Z активно развивается система образования и научных исследований. Какие из перечисленных фактов свидетельствуют о возрастании роли науки и образования в обществе? Запишите цифры, под которыми они указаны.","options":["увеличение числа исследовательских проектов, результаты которых применяются в производстве","сохранение традиционных народных праздников","развитие программ непрерывного образования взрослых","расширение применения научных разработок в медицине","увеличение количества развлекательных телевизионных передач","отказ предприятий от внедрения новых технологий"],"answer":"134","explanation":"1 — верно: применение научных результатов в производстве показывает практическую роль науки. 3 — верно: непрерывное образование позволяет обновлять знания и навыки. 4 — верно: научные разработки используются для решения практических задач медицины. 2 — неверно: сохранение праздников само по себе не свидетельствует о росте роли науки и образования. 5 — неверно: развлекательное телевидение не является прямым показателем этого процесса. 6 — неверно: отказ от технологий противоречит описанному направлению развития.","source":"Авторское задание по образцу задания 4"},{"id":"S1-07","sectionId":"S1","topicId":"S1.T2","ege":3,"role":"control","type":"match","scoring":"exact1","maxPoints":1,"text":"Установите соответствие между характеристиками знания и видами истины: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) отражает объект неполно и может уточняться по мере развития познания","Б) представляет собой исчерпывающее знание об объекте","В) содержит знания, которые могут быть дополнены новыми научными открытиями","Г) предполагает полноту и окончательность знания об объекте","Д) характеризуется исторической ограниченностью достигнутого уровня знания"],"right":["1) относительная истина","2) абсолютная истина"],"answer":"12121","explanation":"А — 1: относительная истина неполна и допускает уточнение. Б — 2: абсолютная истина понимается как исчерпывающее знание. В — 1: возможность дополнения характерна для относительной истины. Г — 2: полнота и окончательность соответствуют абсолютной истине. Д — 1: относительная истина зависит от исторически достигнутого уровня познания.","source":"Авторское задание по образцу задания 3"},{"id":"S1-08","sectionId":"S1","topicId":"S1.T6","ege":2,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о религии и искусстве как формах духовной культуры и запишите цифры, под которыми они указаны.","options":["Религия может выполнять функцию объединения верующих в общности.","Искусство отражает действительность исключительно с помощью научных понятий и доказательств.","Одной из особенностей искусства является создание художественных образов.","Свобода совести предполагает обязательное исповедание человеком какой-либо религии.","Искусство способно оказывать эмоциональное воздействие на человека.","Все религии имеют одинаковые обряды и вероучения."],"answer":"135","explanation":"1 — верно: религия может объединять людей на основе общих верований. 3 — верно: художественный образ является важным средством искусства. 5 — верно: искусство воздействует на чувства и переживания человека. 2 — неверно: научные понятия и доказательства характерны прежде всего для науки. 4 — неверно: свобода совести включает возможность не исповедовать религию. 6 — неверно: религии различаются вероучениями и обрядами.","source":"Авторское задание по образцу задания 2"},{"id":"S2-01","sectionId":"S2","topicId":"S2.T3","ege":1,"role":"diagnostic","type":"set","scoring":"all1","maxPoints":1,"text":"Ниже приведён перечень примеров. Все они, за исключением двух, относятся к переменным издержкам фирмы в краткосрочном периоде. Найдите два примера, «выпадающих» из общего ряда, и запишите в таблицу цифры, под которыми они указаны.","options":["плата за сырьё","оклады администрации","выплата ранее взятого кредита и процентов по нему","плата за потреблённую электроэнергию","оплата транспортных услуг","сдельная заработная плата рабочих"],"answer":"23","explanation":"2 и 3 — правильный ответ: в классификации данного задания эти расходы не относятся к переменным издержкам. 1 — затраты на сырьё зависят от объёма производства. 4 — затраты на электроэнергию, потребляемую в производстве, могут изменяться вместе с выпуском. 5 — транспортные расходы в рассматриваемом случае относятся к переменным. 6 — сдельная оплата труда зависит от количества выполненной работы.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 1"},{"id":"S2-03","sectionId":"S2","topicId":"S2.T1","ege":5,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения об экономических системах и ограниченности ресурсов и запишите цифры, под которыми они указаны.","options":["Ограниченность экономических ресурсов обусловливает необходимость выбора способов их использования.","В командной экономической системе все решения о производстве товаров принимаются исключительно потребителями.","В рыночной экономике цены могут выполнять информационную функцию.","Альтернативная стоимость выбора связана с ценностью лучшей из отвергнутых возможностей.","В любой экономической системе полностью отсутствует проблема ограниченности ресурсов."],"answer":"134","explanation":"1 — верно: ограниченность ресурсов заставляет выбирать между вариантами их использования. 3 — верно: цены передают участникам рынка информацию о спросе и предложении. 4 — верно: альтернативная стоимость связана с лучшей упущенной возможностью. 2 — неверно: для командной экономики характерно централизованное принятие основных хозяйственных решений. 5 — неверно: проблема ограниченности ресурсов существует при любой экономической системе.","source":"Авторское задание по образцу задания 5"},{"id":"S2-04","sectionId":"S2","topicId":"S2.T4","ege":6,"role":"practice","type":"match","scoring":"match2","maxPoints":2,"text":"Установите соответствие между функциями и уровнями банковской системы Российской Федерации: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) проведение денежно-кредитной политики","Б) открытие и ведение банковских счетов клиентов","В) установление правил проведения банковских операций","Г) предоставление кредитов гражданам","Д) осуществление надзора за деятельностью кредитных организаций"],"right":["1) Банк России","2) коммерческие банки"],"answer":"12121","explanation":"А — 1: денежно-кредитную политику проводит Банк России. Б — 2: коммерческие банки открывают и ведут счета клиентов. В — 1: Банк России устанавливает правила проведения банковских операций. Г — 2: коммерческие банки предоставляют кредиты гражданам. Д — 1: надзор за деятельностью кредитных организаций осуществляет Банк России.","source":"Авторское задание по образцу задания 6"},{"id":"S2-05","sectionId":"S2","topicId":"S2.T2","ege":7,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"В городе Z действует множество независимых кофеен. Они предлагают схожие, но различающиеся по ассортименту и оформлению услуги. Каждая кофейня может в определённых пределах влиять на цены своей продукции. Найдите в приведённом ниже списке характеристики данного рынка и запишите цифры, под которыми они указаны.","options":["монополистическая конкуренция","дифференцированная продукция","единственный продавец на рынке","полное отсутствие конкуренции","олигополия","наличие множества продавцов"],"answer":"126","explanation":"1 — верно: сочетание множества продавцов и дифференцированной продукции характерно для монополистической конкуренции. 2 — верно: кофейни различаются ассортиментом и оформлением. 6 — верно: на рынке действует множество продавцов. 3 — неверно: продавец не единственный. 4 — неверно: кофейни конкурируют друг с другом. 5 — неверно: олигополия предполагает господство небольшого числа крупных продавцов.","source":"Авторское задание по образцу задания 7"},{"id":"S2-06","sectionId":"S2","topicId":"S2.T6","ege":5,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения об экономическом росте и мировой экономике и запишите цифры, под которыми они указаны.","options":["Экстенсивный экономический рост может происходить за счёт увеличения количества используемых производственных ресурсов.","Интенсивный экономический рост связан исключительно с расширением площади производственных помещений.","Международное разделение труда предполагает специализацию стран на производстве определённых товаров и услуг.","Рост производительности труда может способствовать интенсивному экономическому росту.","Международная торговля полностью исключает экономическую взаимозависимость государств."],"answer":"134","explanation":"1 — верно: экстенсивный рост обеспечивается увеличением объёма используемых ресурсов. 3 — верно: международное разделение труда основано на специализации стран. 4 — верно: повышение производительности является фактором интенсивного роста. 2 — неверно: расширение помещений само по себе не характеризует интенсивный рост. 5 — неверно: международная торговля создаёт и усиливает экономические связи между государствами.","source":"Авторское задание по образцу задания 5"},{"id":"S2-07","sectionId":"S2","topicId":"S2.T3","ege":1,"role":"control","type":"set","scoring":"all1","maxPoints":1,"text":"Ниже приведён перечень примеров. Все они, за исключением двух, относятся к постоянным издержкам фирмы в краткосрочном периоде. Найдите два примера, «выпадающих» из общего ряда, и запишите цифры, под которыми они указаны.","options":["арендная плата за производственное помещение по договору с фиксированной ежемесячной суммой","оплата сырья, расходуемого при изготовлении продукции","фиксированный оклад директора предприятия","страховой взнос за производственное оборудование, размер которого не зависит от выпуска продукции","сдельная заработная плата рабочих","фиксированная ежемесячная плата за охрану производственного помещения"],"answer":"25","explanation":"2 и 5 — переменные издержки: расход сырья и сдельная оплата труда изменяются вместе с объёмом выпуска. 1 — фиксированная арендная плата относится к постоянным издержкам. 3 — фиксированный оклад директора не зависит от объёма производства. 4 — страховой взнос с фиксированным размером не зависит от выпуска. 6 — фиксированная плата за охрану также относится к постоянным издержкам.","source":"Авторское задание по образцу задания 1"},{"id":"S2-08","sectionId":"S2","topicId":"S2.T2","ege":7,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"В стране Z услуги железнодорожных перевозок на определённом маршруте предоставляет единственная компания. У других компаний отсутствует возможность предложить перевозки по этому маршруту, а действующий перевозчик контролирует объём предложения услуг. Найдите в приведённом ниже списке характеристики описанного рынка и запишите цифры, под которыми они указаны.","options":["наличие единственного продавца","совершенная конкуренция","монополия","отсутствие конкурирующих продавцов на данном маршруте","множество независимых продавцов одинаковых услуг","монополистическая конкуренция"],"answer":"134","explanation":"1 — верно: на описанном маршруте действует один продавец. 3 — верно: такая структура рынка соответствует монополии. 4 — верно: конкурирующие продавцы на данном маршруте отсутствуют. 2 — неверно: совершенная конкуренция предполагает множество продавцов. 5 — неверно: множество продавцов в условии отсутствует. 6 — неверно: монополистическая конкуренция предполагает наличие нескольких конкурирующих производителей.","source":"Авторское задание по образцу задания 7"},{"id":"S3-01","sectionId":"S3","topicId":"S3.T2","ege":8,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения об этнических общностях и запишите цифры, под которыми они указаны.","options":["Одной из предпосылок формирования этнических общностей становится возникновение массовой культуры.","Этническая общность – это исторически сложившаяся на определённой территории общность людей, обладающих схожими, относительно стабильными особенностями культуры, языка, психического склада.","К этническим общностям относят семью, трудовой коллектив, школьный класс.","Народность и племя – этносоциальные общности.","Представители этнической общности имеют общую историю."],"answer":"245","explanation":"2 — верно: этническая общность характеризуется исторически сложившимися культурными и языковыми особенностями. 4 — верно: племя и народность относятся к историческим типам этнических общностей. 5 — верно: общность исторического происхождения и прошлого является одним из признаков этнической общности. 1 — неверно: формирование этнических общностей исторически предшествовало появлению массовой культуры. 3 — неверно: семья, трудовой коллектив и школьный класс являются социальными группами, но не этническими общностями.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 8"},{"id":"S3-03","sectionId":"S3","topicId":"S3.T3","ege":8,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальных статусах и ролях человека и запишите цифры, под которыми они указаны.","options":["Социальный статус характеризует положение человека в обществе или социальной группе.","Все социальные статусы человек получает исключительно в результате собственных усилий.","Один человек может одновременно обладать несколькими социальными статусами.","Социальная роль представляет собой модель поведения, ожидаемого от человека в соответствии с его статусом.","Социальные роли человека никогда не изменяются на протяжении жизни."],"answer":"134","explanation":"1 — верно: статус отражает положение человека в системе социальных отношений. 3 — верно: человек может одновременно быть студентом, работником и членом семьи. 4 — верно: социальная роль связана с ожидаемым поведением носителя статуса. 2 — неверно: существуют предписанные статусы, не зависящие от личных достижений. 5 — неверно: социальные роли меняются при изменении положения человека и жизненных обстоятельств.","source":"Авторское задание по образцу задания 8"},{"id":"S3-04","sectionId":"S3","topicId":"S3.T4","ege":8,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о семье и социализации личности и запишите цифры, под которыми они указаны.","options":["Семья может выполнять функцию первичной социализации ребёнка.","Социализация человека полностью завершается с достижением совершеннолетия.","В процессе социализации человек усваивает социальные нормы и ценности.","Семья как социальный институт выполняет исключительно экономическую функцию.","Взаимодействие с окружающими людьми способствует освоению социальных ролей.","Агенты социализации ограничиваются только членами семьи."],"answer":"135","explanation":"1 — верно: семья является одним из основных институтов первичной социализации. 3 — верно: социализация предполагает усвоение социальных норм и ценностей. 5 — верно: взаимодействие с людьми помогает осваивать социальные роли. 2 — неверно: социализация продолжается на протяжении жизни. 4 — неверно: семья выполняет также воспитательную, эмоциональную и другие функции. 6 — неверно: агентами социализации могут выступать сверстники, учителя и другие люди.","source":"Авторское задание по образцу задания 8"},{"id":"S3-05","sectionId":"S3","topicId":"S3.T5","ege":8,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальных нормах и социальном контроле и запишите цифры, под которыми они указаны.","options":["Социальные нормы регулируют поведение людей в обществе.","Все социальные нормы устанавливаются исключительно органами государственной власти.","Социальные санкции могут быть положительными и отрицательными.","Неформальный социальный контроль осуществляется исключительно с помощью государственных органов.","Общественное одобрение поступка может выступать положительной неформальной санкцией."],"answer":"135","explanation":"1 — верно: социальные нормы задают образцы допустимого и ожидаемого поведения. 3 — верно: санкции могут поощрять или осуждать действия человека. 5 — верно: общественное одобрение является примером положительной неформальной санкции. 2 — неверно: нормы могут формироваться в обществе без участия государства. 4 — неверно: неформальный контроль осуществляется через общественное мнение и повседневные взаимодействия.","source":"Авторское задание по образцу задания 8"},{"id":"S3-06","sectionId":"S3","topicId":"S3.T6","ege":8,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальных конфликтах и способах их разрешения и запишите цифры, под которыми они указаны.","options":["Социальный конфликт может возникнуть из-за столкновения противоположных интересов участников общественных отношений.","Любой социальный конфликт обязательно приводит к полному разрушению социальных связей.","Переговоры могут использоваться как способ урегулирования социального конфликта.","Социальные конфликты возникают исключительно между отдельными людьми и никогда между группами.","Компромисс предполагает взаимные уступки сторон конфликта."],"answer":"135","explanation":"1 — верно: противоречие интересов может стать причиной конфликта. 3 — верно: переговоры позволяют сторонам искать согласованное решение. 5 — верно: компромисс предполагает взаимные уступки. 2 — неверно: конфликты не всегда разрушают социальные связи и могут способствовать выявлению проблем. 4 — неверно: конфликты возможны как между отдельными людьми, так и между социальными группами.","source":"Авторское задание по образцу задания 8"},{"id":"S3-07","sectionId":"S3","topicId":"S3.T2","ege":8,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о межнациональных отношениях и запишите цифры, под которыми они указаны.","options":["Межнациональные отношения могут включать сотрудничество представителей разных этнических общностей.","Этническая принадлежность человека всегда однозначно определяет его профессиональные способности.","Межнациональные конфликты могут возникать в результате противоречий интересов этнических групп.","Уважение культурных особенностей разных народов может способствовать гармонизации межнациональных отношений.","Все этнические общности обладают полностью одинаковыми культурными традициями."],"answer":"134","explanation":"1 — верно: сотрудничество является одной из форм межнациональных отношений. 3 — верно: противоречия интересов могут приводить к межнациональным конфликтам. 4 — верно: уважение культурного многообразия способствует взаимопониманию. 2 — неверно: профессиональные способности не определяются этнической принадлежностью. 5 — неверно: этнические общности отличаются культурными традициями.","source":"Авторское задание по образцу задания 8"},{"id":"S3-08","sectionId":"S3","topicId":"S3.T1","ege":8,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о социальных группах и социальной мобильности и запишите цифры, под которыми они указаны.","options":["Социальные группы могут различаться по численности и характеру взаимодействия участников.","Переход человека с должности руководителя организации на должность рядового сотрудника может служить примером нисходящей социальной мобильности.","Принадлежность человека к малой социальной группе всегда исключает его участие в больших социальных группах.","Профессиональная деятельность может влиять на социальное положение человека.","Горизонтальная социальная мобильность обязательно предполагает повышение дохода и общественного престижа.","Любое изменение социального положения человека является исключительно результатом его личного выбора."],"answer":"124","explanation":"1 — верно: социальные группы различаются по размеру и особенностям взаимодействия. 2 — верно: переход с руководящей должности на рядовую может означать нисходящую мобильность. 4 — верно: профессия и характер трудовой деятельности могут влиять на социальный статус. 3 — неверно: человек может одновременно принадлежать малым и большим группам. 5 — неверно: горизонтальная мобильность не обязательно связана с повышением дохода или престижа. 6 — неверно: изменение социального положения может зависеть от внешних обстоятельств.","source":"Авторское задание по образцу задания 8"},{"id":"S4-02","sectionId":"S4","topicId":"S4.T5","ege":11,"role":"diagnostic","type":"set","scoring":"set2","maxPoints":2,"text":"В демократическом государстве Z в результате реформы избирательной системы был совершён переход от пропорциональной к мажоритарной системе выборов в парламент. Что из перечисленного осталось неизменным в итоге избирательной реформы? Запишите соответствующие цифры.","options":["принцип тайного голосования","голосование по единому общенациональному избирательному округу","наличие предвыборной агитации","возможность выдвижения независимых беспартийных кандидатов","свободное и добровольное участие граждан в выборах","равное избирательное право"],"answer":"1356","explanation":"1 — верно: тайное голосование является демократическим принципом выборов. 3 — верно: предвыборная агитация сохраняется. 5 — верно: свободное участие граждан не зависит от типа избирательной системы. 6 — верно: равное избирательное право также сохраняется. 2 — неверно: единый общенациональный округ характерен для определённых моделей пропорциональной системы. 4 — неверно: переход к мажоритарной системе может изменить порядок и возможности выдвижения кандидатов.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 11"},{"id":"S4-03","sectionId":"S4","topicId":"S4.T2","ege":10,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о государстве и формах государства и запишите цифры, под которыми они указаны.","options":["В федеративном государстве административно-территориальные единицы всегда обладают государственным суверенитетом.","Форма правления характеризует порядок формирования высших органов государственной власти и отношения между ними.","В унитарном государстве обязательно существует двухпалатный парламент.","Политический режим характеризует методы и способы осуществления государственной власти.","Монархия и республика являются разновидностями формы государственного устройства.","Одним из признаков государства является наличие публичной власти."],"answer":"246","explanation":"2 — верно: форма правления описывает организацию высших органов власти. 4 — верно: политический режим характеризует способы осуществления власти. 6 — верно: публичная власть является признаком государства. 1 — неверно: субъекты федерации не обязательно обладают государственным суверенитетом. 3 — неверно: двухпалатный парламент не является обязательным признаком унитарного государства. 5 — неверно: монархия и республика — формы правления, а не государственного устройства.","source":"Авторское задание по образцу задания 10"},{"id":"S4-04","sectionId":"S4","topicId":"S4.T3","ege":13,"role":"practice","type":"match","scoring":"match2","maxPoints":2,"text":"Установите соответствие между полномочиями и субъектами государственной власти Российской Федерации, реализующими эти полномочия: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) назначение выборов Президента Российской Федерации","Б) решение вопроса о доверии Правительству Российской Федерации","В) утверждение изменения границ между субъектами Российской Федерации","Г) объявление амнистии","Д) утверждение по представлению Президента Российской Федерации кандидатуры Председателя Правительства Российской Федерации"],"right":["1) Государственная Дума","2) Совет Федерации"],"answer":"21211","explanation":"А — 2: Совет Федерации назначает выборы Президента РФ. Б — 1: Государственная Дума решает вопрос о доверии Правительству РФ. В — 2: Совет Федерации утверждает изменение границ между субъектами РФ. Г — 1: Государственная Дума объявляет амнистию. Д — 1: Государственная Дума утверждает кандидатуру Председателя Правительства РФ по представлению Президента.","source":"Авторское задание по образцу задания 13"},{"id":"S4-05","sectionId":"S4","topicId":"S4.T4","ege":10,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о политическом участии граждан и запишите цифры, под которыми они указаны.","options":["Участие в выборах является одной из форм политического участия граждан.","Политическое участие всегда предполагает обязательное членство в политической партии.","Граждане могут участвовать в политической жизни посредством обращения в органы государственной власти.","Политический абсентеизм означает активное участие во всех политических мероприятиях.","Участие в законных публичных мероприятиях может быть формой политической активности.","Политическое участие ограничивается исключительно голосованием на выборах."],"answer":"135","explanation":"1 — верно: голосование на выборах является формой политического участия. 3 — верно: обращения в органы власти позволяют гражданам участвовать в решении общественных вопросов. 5 — верно: законные публичные мероприятия могут выражать политическую позицию. 2 — неверно: членство в партии не обязательно. 4 — неверно: абсентеизм связан с уклонением от политического участия. 6 — неверно: политическое участие включает множество форм помимо голосования.","source":"Авторское задание по образцу задания 10"},{"id":"S4-06","sectionId":"S4","topicId":"S4.T6","ege":10,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о политическом лидерстве и средствах массовой информации в политической жизни общества и запишите цифры, под которыми они указаны.","options":["Средства массовой информации всегда полностью исключают возможность манипулирования общественным мнением.","Политический лидер может оказывать влияние на поведение участников политического процесса.","Все политические лидеры получают свои полномочия исключительно по наследству.","Средства массовой информации могут распространять сведения о деятельности органов государственной власти.","Политическое лидерство существует исключительно в монархических государствах.","Средства массовой информации могут способствовать формированию общественного мнения."],"answer":"246","explanation":"2 — верно: политический лидер способен влиять на участников политических отношений. 4 — верно: СМИ информируют общество о деятельности власти. 6 — верно: СМИ участвуют в формировании общественного мнения. 1 — неверно: СМИ могут использоваться для манипулирования. 3 — неверно: наследование не является универсальным способом приобретения лидерства. 5 — неверно: политическое лидерство существует при разных формах правления.","source":"Авторское задание по образцу задания 10"},{"id":"S4-07","sectionId":"S4","topicId":"S4.T5","ege":11,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"В демократическом государстве Z парламент избирался по мажоритарной системе относительного большинства. После реформы была введена пропорциональная избирательная система с голосованием за партийные списки. Какие изменения непосредственно связаны с переходом к новой избирательной системе? Запишите соответствующие цифры.","options":["избиратели стали голосовать за списки кандидатов, выдвинутые политическими партиями","был отменён принцип тайного голосования","распределение депутатских мандатов стало зависеть от доли голосов, полученных партийными списками","избирательные права получили исключительно члены политических партий","основным способом определения победителя осталось получение наибольшего числа голосов отдельным кандидатом в одномандатном округе","политические партии получили возможность представлять коллективные списки кандидатов"],"answer":"136","explanation":"1 — верно: при описанной пропорциональной системе избиратели голосуют за партийные списки. 3 — верно: распределение мандатов связано с результатами голосования за списки. 6 — верно: партийные списки являются основой описанной системы. 2 — неверно: тайное голосование сохраняется как демократический принцип. 4 — неверно: членство в партии не является условием обладания избирательными правами. 5 — неверно: этот принцип относится к мажоритарной системе относительного большинства.","source":"Авторское задание по образцу задания 11"},{"id":"S4-08","sectionId":"S4","topicId":"S4.T3","ege":13,"role":"control","type":"match","scoring":"match2","maxPoints":2,"text":"Установите соответствие между полномочиями и субъектами государственной власти Российской Федерации, реализующими эти полномочия: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) подписание и обнародование федеральных законов","Б) осуществление мер по обеспечению обороны страны","В) осуществление помилования","Г) разработка и представление Государственной Думе федерального бюджета","Д) осуществление руководства внешней политикой Российской Федерации"],"right":["1) Президент Российской Федерации","2) Правительство Российской Федерации"],"answer":"12121","explanation":"А — 1: Президент подписывает и обнародует федеральные законы. Б — 2: Правительство осуществляет меры по обеспечению обороны страны. В — 1: помилование осуществляет Президент. Г — 2: Правительство разрабатывает и представляет Государственной Думе федеральный бюджет. Д — 1: Президент осуществляет руководство внешней политикой Российской Федерации.","source":"Авторское задание по образцу задания 13"},{"id":"S5-01","sectionId":"S5","topicId":"S5.T6","ege":15,"role":"diagnostic","type":"match","scoring":"match2","maxPoints":2,"text":"Установите соответствие между примерами и видами юридической ответственности в Российской Федерации: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) дисквалификация","Б) взыскание неустойки","В) возмещение убытков","Г) лишение права занимать определённые должности или заниматься определённой деятельностью","Д) компенсация морального вреда"],"right":["1) административные наказания по Кодексу Российской Федерации об административных правонарушениях","2) наказания по Уголовному кодексу Российской Федерации","3) способы защиты гражданских прав по Гражданскому кодексу Российской Федерации"],"answer":"13323","explanation":"А — 1: дисквалификация является административным наказанием. Б — 3: взыскание неустойки относится к способам защиты гражданских прав. В — 3: возмещение убытков предусмотрено гражданским законодательством. Г — 2: лишение права занимать определённые должности или заниматься определённой деятельностью предусмотрено уголовным законодательством как наказание. Д — 3: компенсация морального вреда является способом защиты гражданских прав.","source":"Демоверсия ФИПИ ЕГЭ 2027 (проект), задание 15"},{"id":"S5-03","sectionId":"S5","topicId":"S5.T1","ege":14,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о системе права Российской Федерации и запишите цифры, под которыми они указаны.","options":["Нормы права регулируют общественные отношения и обеспечиваются возможностью государственного принуждения.","Отрасль права представляет собой совокупность норм, регулирующих определённую сферу однородных общественных отношений.","Правовой обычай никогда не может выступать источником права.","Институт права объединяет нормы, регулирующие определённый вид общественных отношений.","Любая правовая норма обязательно содержится исключительно в Конституции Российской Федерации.","Система права и система законодательства являются полностью тождественными понятиями."],"answer":"124","explanation":"1 — верно: общеобязательность и государственное обеспечение относятся к признакам права. 2 — верно: отрасли права регулируют однородные группы общественных отношений. 4 — верно: институт права объединяет нормы внутри соответствующей области регулирования. 3 — неверно: правовой обычай может признаваться источником права. 5 — неверно: правовые нормы содержатся в различных источниках права. 6 — неверно: система права отражает внутреннюю структуру правовых норм, а система законодательства — организацию нормативных правовых актов.","source":"Авторское задание по образцу задания 14"},{"id":"S5-04","sectionId":"S5","topicId":"S5.T2","ege":14,"role":"practice","type":"set","scoring":"set2","maxPoints":2,"text":"Выберите верные суждения о конституционных правах и свободах человека и гражданина в Российской Федерации и запишите цифры, под которыми они указаны.","options":["Право на жилище относится исключительно к политическим правам граждан.","Каждому гарантируется свобода мысли и слова.","Право избирать органы государственной власти принадлежит всем находящимся на территории Российской Федерации иностранным гражданам.","Каждый имеет право на охрану здоровья и медицинскую помощь.","Каждый имеет право на образование.","Свобода совести означает обязанность каждого человека исповедовать какую-либо религию."],"answer":"245","explanation":"2 — верно: свобода мысли и слова закреплена Конституцией РФ. 4 — верно: Конституция гарантирует право на охрану здоровья и медицинскую помощь. 5 — верно: право на образование закреплено Конституцией. 1 — неверно: право на жилище относится к социально-экономическим правам. 3 — неверно: иностранные граждане не пишите цифры, под которыми они указаны.","options":["Налоги и сборы в Российской Федерации могут устанавливаться исключительно по личному усмотрению работодателя.","Конституция Российской Федерации предусматривает обязанность каждого платить законно установленные налоги и сборы.","Право на образование гарантировано исключительно гражданам, имеющим постоянную работу.","В Российской Федерации гарантируются общедоступность и бесплатность дошкольного, основного общего и среднего профессионального образования в государственных или муниципальных образовательных учреждениях и на предприятиях.","Основное общее образование является обязательным.","Конституция Российской Федерации полностью запрещает получение образования в негосударственных образовательных организациях."],"answer":"245","explanation":"2 — верно: обязанность платить законно установленные налоги и сборы закреплена Конституцией. 4 — верно: соответствующая гарантия установлена статьёй 43 Конституции РФ. 5 — верно: основное общее образование обязательно. 1 — неверно: работодатель не устанавливает налоги по собственному усмотрению. 3 — неверно: право на образование не зависит от наличия постоянной работы. 6 — неверно: Конституция не содержит такого запрета.","source":"Авторское задание по образцу задания 14"},{"id":"S5-07","sectionId":"S5","topicId":"S5.T6","ege":15,"role":"control","type":"match","scoring":"match2","maxPoints":2,"text":"Установите соответствие между примерами и видами юридической ответственности в Российской Федерации: к каждой позиции, данной в первом столбце, подберите соответствующую позицию из второго столбца. Запишите в таблицу выбранные цифры под соответствующими буквами.","left":["А) административный штраф за нарушение правил дорожного движения","Б) лишение свободы на определённый срок за совершение преступления","В) возмещение имущественного вреда, причинённого чужому имуществу","Г) обязательные работы как административное наказание","Д) исправительные работы как уголовное наказание"],"right":["1) гражданско-правовая ответственность","2) административная ответственность","3) уголовная ответственность"],"answer":"23123","explanation":"А — 2: административный штраф за нарушение ПДД относится к административной ответственности. Б — 3: лишение свободы за преступление является уголовным наказанием. В — 1: возмещение имущественного вреда относится к гражданско-правовым способам защиты. Г — 2: обязательные работы предусмотрены как административное наказание. Д — 3: исправительные работы являются видом уголовного наказания.","source":"Авторское задание по образцу задания 15"},{"id":"S5-08","sectionId":"S5","topicId":"S5.T4","ege":16,"role":"control","type":"set","scoring":"set2","maxPoints":2,"text":"Совершеннолетние граждане Российской Федерации Ольга и Максим, состоящие в зарегистрированном браке, решили изменить установленный законом режим совместной собственности супругов и заключить брачный договор. Какие из перечисленных условий могут быть включены в брачный договор в Российской Федерации? Запишите цифры, под которыми они указаны.","options":["обязанность одного из супругов отказаться от права на обращение в суд","установление режима раздельной собственности на определённое имущество супругов","запрет одному из супругов поддерживать общение с родственниками","определение порядка несения семейных расходов","определение имущественных прав и обязанностей супругов на случай расторжения брака","ограничение права нетрудоспособного нуждающегося супруга на получение содержания"],"answer":"245","explanation":"2 — верно: брачный договор может устанавливать режим раздельной собственности. 4 — верно: супруги могут определить порядок несения семейных расходов. 5 — верно: договор может устанавливать имущественные права и обязанности на случай расторжения брака. 1 — неверно: нельзя ограничивать право на обращение в суд. 3 — неверно: брачный договор не регулирует личные неимущественные отношения супругов. 6 — неверно: нельзя ограничивать право нетрудоспособного нуждающегося супруга на получение содержания.","source":"Авторское задание по образцу задания 16"}]}</script>

<script>
const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const $ = id => document.getElementById(id);
const view = $('view');
let bank = JSON.parse($('bank').textContent);
let storageAvailable = true;
let profile = emptyProfile();
let selectedSection = null;
let currentScreen = 'home';

function emptyProfile() {
  return {
    version: 1,
    attempts: [],
    practiceHistory: [],
    previous: null,
    session: null
  };
}

function node(tag, text, className) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = String(text);
  if (className) e.className = className;
  return e;
}

function append(parent, ...children) {
  children.forEach(c => parent.appendChild(c));
  return parent;
}

function button(text, action, className = '') {
  const b = node('button', text, className);
  b.type = 'button';
  b.addEventListener('click', action);
  return b;
}

function clear() {
  view.replaceChildren();
  window.scrollTo(0, 0);
}

function card(title, description = '') {
  const c = node('section', undefined, 'card');
  if (title) c.append(node('h2', title));
  if (description) c.append(node('p', description, 'muted'));
  view.append(c);
  return c;
}

function actions(parent, ...buttons) {
  const row = node('div', undefined, 'actions');
  append(row, ...buttons);
  parent.append(row);
  return row;
}

function notice(parent, message, kind = '') {
  const e = node('div', message, 'notice ' + kind);
  parent.append(e);
  return e;
}

function validProfile(p) {
  if (!p || typeof p !== 'object' || Array.isArray(p)) return false;
  if (p.version !== 1) return false;
  if (!Array.isArray(p.attempts) || !Array.isArray(p.practiceHistory)) return false;
  if (!(p.previous === null || (
    typeof p.previous === 'object' &&
    !Array.isArray(p.previous)
  ))) return false;

  const validAttempt = a =>
    a &&
    typeof a.id === 'string' &&
    typeof a.sectionId === 'string' &&
    typeof a.topicId === 'string' &&
    Number.isFinite(a.points) &&
    Number.isFinite(a.maxPoints) &&
    a.maxPoints > 0 &&
    a.points >= 0 &&
    a.points <= a.maxPoints;

  if (!p.attempts.every(validAttempt)) return false;
  if (!p.practiceHistory.every(validAttempt)) return false;

  if (p.session !== null) {
    const s = p.session;
    if (!s || !['diagnostic', 'practice', 'control'].includes(s.mode)) return false;
    if (!Array.isArray(s.ids) || !s.ids.every(x => typeof x === 'string')) return false;
    if (!Number.isInteger(s.index) || s.index < 0 || s.index > s.ids.length) return false;
    if (!Array.isArray(s.results)) return false;
    if (!Array.isArray(s.trainedSections)) return false;
  }

  return true;
}

function save() {
  if (storageAvailable) {
    try {
      localStorage.setItem('ege2027-profile', JSON.stringify(profile));
    } catch (e) {
      storageAvailable = false;
    }
  }
  showStorageWarning();
}

function showStorageWarning() {
  const area = $('warning');
  area.replaceChildren();
  if (!storageAvailable) {
    notice(
      area,
      'Локальное хранилище недоступно. Прогресс сохраняется только в памяти до закрытия страницы. Используйте «Сохранить прогресс в файл».',
      'error'
    );
  }
}

try {
  const raw = localStorage.getItem('ege2027-profile');
  if (raw) {
    const parsed = JSON.parse(raw);
    if (validProfile(parsed)) profile = parsed;
  }
} catch (e) {
  storageAvailable = false;
}

showStorageWarning();

function clean(value) {
  return String(value ?? '').replace(/\D/g, '');
}

function sameSet(a, b) {
  return a.length === b.length &&
    new Set(a).size === a.length &&
    [...a].every(x => b.includes(x));
}

function score(q, response) {
  const a = clean(response);
  const key = q.answer;

  if (q.scoring === 'exact1') {
    return a === key ? 1 : 0;
  }

  if (q.scoring === 'all1') {
    return sameSet(a, key) ? 1 : 0;
  }

  if (q.scoring === 'set2') {
    const actual = new Set(a);
    const expected = new Set(key);
    let errors = 0;

    for (const digit of actual) {
      if (!expected.has(digit)) errors++;
    }
    for (const digit of expected) {
      if (!actual.has(digit)) errors++;
    }

    if (actual.size !== a.length) {
      errors += a.length - actual.size;
    }

    return errors === 0 ? 2 : errors === 1 ? 1 : 0;
  }

  if (q.scoring === 'match2') {
    if (a.length > key.length) return 0;
    let errors = 0;
    for (let i = 0; i < key.length; i++) {
      if (a[i] !== key[i]) errors++;
    }
    return errors === 0 ? 2 : errors === 1 ? 1 : 0;
  }

  return 0;
}

function questionById(id) {
  return bank.questions.find(q => q.id === id);
}

function stats() {
  return bank.spec.sections.map(section => {
    const attempts = profile.attempts
      .filter(a => a.sectionId === section.id)
      .slice(-6);

    const max = attempts.reduce((sum, a) => sum + a.maxPoints, 0);
    const earned = attempts.reduce((sum, a) => sum + a.points, 0);

    return {
      ...section,
      attempts,
      count: attempts.length,
      earned,
      max,
      pct: max ? 100 * earned / max : null,
      status: !attempts.length
        ? 'Не проверен'
        : attempts.length < 3
          ? 'Предварительно'
          : 'Проверен'
    };
  });
}

function home() {
  currentScreen = 'home';
  clear();

  const c = card(
    'ЕГЭ 2027: Обществознание',
    'Пройдите диагностику по пяти разделам. Колесо покажет темы, которым стоит уделить внимание. После тренировки выполните контрольные задания и сравните результаты.'
  );

  const hasSession = profile.session &&
    profile.session.ids.length > profile.session.index;

  c.classList.add('hero');
  actions(
    c,
    button('Начать диагностику', startDiagnostic, 'primary'),
    button('Продолжить', resume, hasSession ? '' : 'secondary'),
    button('Мои результаты', results)
  );

  const info = card('Как это работает');
  append(
    info,
    node('p', 'Диагностика проходит без подсказок и показа правильных ответов.'),
    node('p', 'В тренировке после ответа показываются баллы и объяснение.'),
    node('p', 'Контроль обновляет колесо результатов.'),
    node('p', `Сейчас в банке ${bank.questions.length} заданий. Полный банк можно добавить в разделе учителя.`, 'muted')
  );

  progressControls();
}

function progressControls() {
  const c = card('Мой прогресс');
  actions(
    c,
    button('Сохранить прогресс в файл', downloadProgress),
    button('Загрузить прогресс', () => $('progressFile').click()),
    button('Сбросить прогресс', resetProgress, 'secondary')
  );

  const input = node('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.id = 'progressFile';
  input.hidden = true;
  input.addEventListener('change', loadProgress);
  c.append(input);
}

function startDiagnostic() {
  const ids = bank.questions
    .filter(q => q.role === 'diagnostic')
    .sort((a, b) => a.ege - b.ege || a.id.localeCompare(b.id))
    .map(q => q.id);

  if (!ids.length) {
    clear();
    const c = card('Нет диагностических заданий');
    actions(c, button('На главную', home));
    return;
  }

  profile.session = {
    mode: 'diagnostic',
    ids,
    index: 0,
    results: [],
    trainedSections: []
  };

  save();
  showQuestion();
}

function resume() {
  if (profile.session && profile.session.index < profile.session.ids.length) {
    showQuestion();
  } else {
    results();
  }
}

function showQuestion() {
  const s = profile.session;
  if (!s) return home();

  if (s.index >= s.ids.length) {
    return finishSession();
  }

  const q = questionById(s.ids[s.index]);

  if (!q) {
    s.index++;
    save();
    return showQuestion();
  }

  currentScreen = s.mode;
  clear();

  const title = s.mode === 'diagnostic'
    ? 'Диагностика'
    : s.mode === 'practice'
      ? 'Тренировка'
      : 'Контроль';

  const c = card(title);
  append(
    c,
    node('p', `Задание ${s.index + 1} из ${s.ids.length}`, 'pill'),
    node('p', `ЕГЭ № ${q.ege} · ${bank.spec.sections.find(x => x.id === q.sectionId)?.short || q.sectionId}`, 'muted'),
    node('h3', q.text)
  );

  if (q.type === 'set') {
    const list = node('div', undefined, 'options');
    q.options.forEach((option, i) => {
      const row = node('div', undefined, 'option');
      append(row, node('b', i + 1), node('span', option));
      list.append(row);
    });
    c.append(list);
  } else {
    const cols = node('div', undefined, 'columns');
    const left = node('div');
    const right = node('div');

    append(left, node('h3', 'Первый столбец'));
    append(right, node('h3', 'Второй столбец'));

    q.left.forEach(item => left.append(node('p', item)));
    q.right.forEach((item, i) => right.append(node('p', `${i + 1}) ${item}`)));

    append(cols, left, right);
    c.append(cols);
  }

  c.append(node('p', 'Введите ответ последовательностью цифр без пробелов.'));

  const input = node('input', undefined, 'answer');
  input.type = 'text';
  input.inputMode = 'numeric';
  input.autocomplete = 'off';
  input.setAttribute('aria-label', 'Ваш ответ');
  input.addEventListener('input', () => {
    input.value = clean(input.value);
  });
  c.append(input);

  const feedback = node('div');
  const row = node('div', undefined, 'actions');

  let submitted = false;

  const submit = (unknown = false) => {
    if (submitted) return;
    submitted = true;

    const response = unknown ? '' : clean(input.value);
    const points = unknown ? 0 : score(q, response);

    const result = {
      id: q.id,
      sectionId: q.sectionId,
      topicId: q.topicId,
      points,
      maxPoints: q.maxPoints,
      answer: response,
      unknown,
      time: Date.now()
    };

    s.results.push(result);

    if (s.mode === 'diagnostic' || s.mode === 'control') {
      profile.attempts.push(result);
    } else {
      profile.practiceHistory.push(result);
    }

    input.disabled = true;
    row.replaceChildren();

    if (s.mode === 'practice') {
      append(
        feedback,
        node('h3', `${points} из ${q.maxPoints} баллов`),
        node('p', `Правильный ответ: ${q.answer}`),
        node('p', q.explanation)
      );
    } else {
      feedback.append(
        node('p', 'Ответ принят. Правильный ответ будет скрыт до завершения этого этапа.', 'notice success')
      );
    }

    save();

    row.append(
      button(
        s.index === s.ids.length - 1 ? 'Завершить' : 'Следующее задание',
        () => {
          s.index++;
          save();
          if (s.index >= s.ids.length) finishSession();
          else showQuestion();
        },
        'primary'
      )
    );
  };

  row.append(
    button('Ответить', () => submit(false), 'primary'),
    button('Не знаю', () => submit(true), 'secondary')
  );

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!submitted) submit(false);
    }
  });

  append(c, row, feedback);
  input.focus();
}

function finishSession() {
  const s = profile.session;
  if (!s) return results();

  if (s.mode === 'diagnostic') {
    profile.session = null;
    save();
    return results();
  }

  if (s.mode === 'practice') {
    const trained = [...s.trainedSections];
    profile.session = null;
    save();
    return practiceFinished(trained);
  }

  if (s.mode === 'control') {
    profile.session = null;
    save();
    return results();
  }
}

function svgElement(name, attrs, parent) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  Object.entries(attrs || {}).forEach(([key, value]) => {
    el.setAttribute(key, value);
  });
  if (parent) parent.append(el);
  return el;
}

function drawWheel(data) {
  const shell = node('div', undefined, 'wheel');
  const head = node('div', undefined, 'wheelHead');

  append(
    head,
    node('span', 'Колесо результатов'),
    (() => { const l = node('span', undefined, 'legend'); append(l, node('span', 'Сейчас', 'lg'), node('span', 'До контроля', 'lg prev')); return l; })()
  );
  shell.append(head);

  const W = 820;
  const H = 700;
  const cx = 410;
  const cy = 350;
  const R = 220;
  const n = data.length;

  const svg = svgElement('svg', {
    viewBox: `0 0 ${W} ${H}`,
    role: 'img',
    'aria-label': 'Колесо результатов по пяти разделам'
  });

  const defs = svgElement('defs', {}, svg);
  const gradient = svgElement('linearGradient', {
    id: 'resultGradient',
    x1: '0%',
    y1: '0%',
    x2: '0%',
    y2: '100%'
  }, defs);

  [
    ['0%', '#e3123f'],
    ['50%', '#f3d98b'],
    ['100%', '#e3123f']
  ].forEach(([offset, color]) => {
    svgElement('stop', {
      offset,
      'stop-color': color
    }, gradient);
  });

  for (let i = 1; i <= 5; i++) {
    svgElement('circle', {
      cx,
      cy,
      r: R * i / 5,
      fill: 'none',
      stroke: '#0000001c',
      'stroke-width': 0.8
    }, svg);
  }

  const angles = data.map((_, i) => -Math.PI / 2 + 2 * Math.PI * i / n);

  angles.forEach((angle, i) => {
    svgElement('line', {
      x1: cx,
      y1: cy,
      x2: cx + R * Math.cos(angle),
      y2: cy + R * Math.sin(angle),
      stroke: data[i].pct === null ? '#c9cbc0' : '#00000026',
      'stroke-width': 1
    }, svg);
  });

  function points(values) {
    return values.map((value, i) => {
      const r = R * (value === null ? 0 : value) / 100;
      return {
        x: cx + r * Math.cos(angles[i]),
        y: cy + r * Math.sin(angles[i])
      };
    });
  }

  function smoothPath(pts) {
    let d = '';

    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[(i - 1 + n) % n];
      const p1 = pts[i];
      const p2 = pts[(i + 1) % n];
      const p3 = pts[(i + 2) % n];

      if (i === 0) d += `M ${p1.x} ${p1.y} `;

      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;

      d += `C ${c1x} ${c1y} ${c2x} ${c2y} ${p2.x} ${p2.y} `;
    }

    return d + 'Z';
  }

  const current = points(data.map(s => s.pct));


  for (let i = 0; i < 0; i++) {
    const factor = 0.05 + 0.95 * i / 49;

    const inner = current.map(p => ({
      x: cx + (p.x - cx) * factor,
      y: cy + (p.y - cy) * factor
    }));

    svgElement('path', {
      d: smoothPath(inner),
      fill: 'none',
      stroke: 'url(#resultGradient)',
      'stroke-width': 0.7,
      opacity: 0.72
    }, svg);
  }

  svgElement('path', {
    d: smoothPath(current),
    fill: '#c6ef4e',
    stroke: '#c6ef4e',
    'stroke-width': 2,
    'stroke-linejoin': 'round'
  }, svg);

  angles.forEach(angle => {
    svgElement('line', { x1: cx, y1: cy, x2: cx + R * Math.cos(angle), y2: cy + R * Math.sin(angle), stroke: '#00000030', 'stroke-width': 1 }, svg);
  });

  if (profile.previous) {
    const old = points(data.map(s => profile.previous[s.id] ?? null));

    svgElement('path', {
      d: smoothPath(old),
      fill: 'none',
      stroke: '#000000',
      'stroke-width': 1.6,
      opacity: 1
    }, svg);
  }

  data.forEach((section, i) => {
    const angle = angles[i];
    const r = R + 100;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    const group = svgElement('g', {
      role: 'button',
      tabindex: '0',
      'aria-label': section.name,
      style: 'cursor:pointer'
    }, svg);

    const label = svgElement('text', {
      x,
      y,
      fill: section.pct === null ? '#a5a89c' : '#5f6258',
      'text-anchor': 'middle',
      'font-size': 14,
      'font-weight': 500
    }, group);

    label.textContent = section.short;

    const percent = svgElement('text', {
      x,
      y: y + 23,
      fill: section.pct === null ? '#a5a89c' : '#000000',
      'text-anchor': 'middle',
      'font-size': 17,
      'font-weight': 700
    }, group);

    percent.textContent = section.pct === null
      ? 'не проверен'
      : `${Math.round(section.pct)}%`;

    const open = () => showTopics(section.id);

    group.addEventListener('click', open);
    group.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        open();
      }
    });

    const a1 = angle - Math.PI / n;
    const a2 = angle + Math.PI / n;

    const sector = svgElement('path', {
      d: `M ${cx} ${cy} L ${cx + R * Math.cos(a1)} ${cy + R * Math.sin(a1)} A ${R} ${R} 0 0 1 ${cx + R * Math.cos(a2)} ${cy + R * Math.sin(a2)} Z`,
      fill: 'transparent',
      role: 'button',
      tabindex: '0',
      'aria-label': `Открыть раздел ${section.name}`,
      style: 'cursor:pointer'
    }, svg);

    sector.addEventListener('click', open);
    sector.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        open();
      }
    });
  });

  shell.append(svg);
  return shell;
}

function allocate(weights, count) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (!sum || !count) return weights.map(() => 0);

  const quotas = weights.map(w => count * w / sum);
  const assigned = quotas.map(Math.floor);

  let remaining = count - assigned.reduce((a, b) => a + b, 0);

  const order = quotas
    .map((q, i) => ({i, fraction: q - Math.floor(q)}))
    .sort((a, b) => b.fraction - a.fraction || a.i - b.i);

  for (let i = 0; i < remaining; i++) {
    assigned[order[i].i]++;
  }

  return assigned;
}

function startPractice(count) {
  const checked = stats().filter(s => s.pct !== null);

  if (!checked.length) return practiceSetup();

  const weights = checked.map(s => Math.max(10, 100 - s.pct));
  const quotas = allocate(weights, count);

  const history = new Map();

  profile.practiceHistory.forEach(a => {
    const old = history.get(a.id);
    if (!old) history.set(a.id, []);
    history.get(a.id).push(a);
  });

  function priority(q) {
    const attempts = history.get(q.id) || [];

    if (!attempts.length) return 0;

    const last = attempts[attempts.length - 1];

    if (last.points < last.maxPoints) return 1;

    return 2;
  }

  const pools = checked.map(s =>
    bank.questions
      .filter(q => q.role === 'practice' && q.sectionId === s.id)
      .sort((a, b) => priority(a) - priority(b) || a.ege - b.ege || a.id.localeCompare(b.id))
  );

  const selected = [];
  const used = new Set();
  const trained = new Set();

  function take(sectionIndex) {
    const pool = pools[sectionIndex];

    while (pool.length) {
      const q = pool.shift();

      if (used.has(q.id)) continue;

      used.add(q.id);
      selected.push(q.id);
      trained.add(q.sectionId);
      return true;
    }

    return false;
  }

  quotas.forEach((quota, i) => {
    for (let j = 0; j < quota; j++) {
      if (!take(i)) break;
    }
  });

  while (selected.length < count) {
    let found = false;

    for (let i = 0; i < pools.length; i++) {
      if (take(i)) {
        found = true;
        break;
      }
    }

    if (!found) break;
  }

  if (!selected.length) {
    clear();
    const c = card('Недостаточно заданий');
    notice(c, 'В проверенных разделах пока нет тренировочных заданий. Добавьте партии банка через раздел учителя.');
    actions(c, button('К результатам', results));
    return;
  }

  profile.session = {
    mode: 'practice',
    ids: selected,
    index: 0,
    results: [],
    trainedSections: [...trained],
    requested: count
  };

  save();

  if (selected.length < count) {
    clear();
    const c = card('Тренировка готова');
    notice(
      c,
      `Вы запросили ${count} заданий, но доступно только ${selected.length}. Задания внутри тренировки не повторяются.`
    );
    actions(c, button('Начать', showQuestion, 'primary'));
  } else {
    showQuestion();
  }
}

  append(
    c,
    node('p', 'Теперь можно пройти контроль по разделам, которые вы тренировали. Контрольные ответы не раскрываются до завершения этапа.')

function startControl(trainedSections) {
  const before = stats();

  profile.previous = Object.fromEntries(
    before.map(s => [s.id, s.pct])
  );

  const ids = [];

  trainedSections.forEach(sectionId => {
    const pool = bank.questions
      .filter(q => q.role === 'control' && q.sectionId === sectionId)
      .sort((a, b) => a.ege - b.ege || a.id.localeCompare(b.id))
      .slice(0, 2);

    pool.forEach(q => ids.push(q.id));
  });

  if (!ids.length) {
    clear();
    const c = card('Нет контрольных заданий');
    notice(c, 'Добавьте задания role="control" для разделов, которые тренировались.');
    actions(c, button('К результатам', results));
    return;
  }

  profile.session = {
    mode: 'control',
    ids,
    index: 0,
    results: [],
    trainedSections
  };

  save();
  showQuestion();
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function loadProgress(event) {
  const file = event.target.files?.[0];
  event.target.value = '';

  try {

    if (!validProfile(data)) {
