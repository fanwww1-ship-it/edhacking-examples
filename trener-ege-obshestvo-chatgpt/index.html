function validateBatch(obj) {
  const errors = [];

  if (!obj || !Array.isArray(obj.questions)) {
    return ['Ожидается объект вида {"questions":[...]}'];
  }

  const ids = new Set();
  const sections = new Set(bank.spec.sections.map(s => s.id));
  const topics = new Map(bank.spec.topics.map(t => [t.id, t.sectionId]));

  obj.questions.forEach((q, index) => {
    const fail = message => errors.push(`Задание ${index + 1}: ${message}`);

    if (!q || typeof q !== 'object' || Array.isArray(q)) {
      fail('должен быть объект');
      return;
    }

    const required = [
      'id','sectionId','topicId','ege','role','type',
      'scoring','maxPoints','text','answer','explanation','source'
    ];

    required.forEach(key => {
      if (!(key in q) || q[key] === null || q[key] === '') {
        fail(`отсутствует поле ${key}`);
      }
    });

    if (typeof q.id !== 'string' || !q.id.trim()) {
      fail('id должен быть непустой строкой');
    } else if (ids.has(q.id)) {
      fail(`повтор id ${q.id} внутри партии`);
    } else {
      ids.add(q.id);
    }

    if (!sections.has(q.sectionId)) {
      fail(`неизвестный sectionId ${q.sectionId}`);
    }

    if (topics.get(q.topicId) !== q.sectionId) {
      fail(`topicId ${q.topicId} не относится к разделу ${q.sectionId}`);
    }

    if (!['diagnostic','practice','control'].includes(q.role)) {
      fail('неизвестная роль задания');
    }

    if (!['set','match'].includes(q.type)) {
      fail('type должен быть set или match');
    }

    if (typeof q.answer !== 'string' || !/^[0-9]+$/.test(q.answer)) {
      fail('answer должен быть строкой только из цифр');
    }

    ['text','explanation','source'].forEach(key => {
      if (typeof q[key] !== 'string' || !q[key].trim()) {
        fail(`${key} должен быть непустой строкой`);
      }
    });

    const rule = bank.spec.taskRules.find(r => r.ege === q.ege);

    if (!rule) {
      fail(`нет правила для номера ЕГЭ ${q.ege}`);
    } else if (
      rule.type !== q.type ||
      rule.scoring !== q.scoring ||
      rule.maxPoints !== q.maxPoints
    ) {
      fail(`type, scoring или maxPoints не соответствуют правилу ЕГЭ № ${q.ege}`);
    }

    if (q.type === 'set') {
      if (
        !Array.isArray(q.options) ||
        q.options.length < 2 ||
        q.options.some(x => typeof x !== 'string' || !x.trim())
      ) {
        fail('options должен содержать минимум два непустых варианта');
      }

      if ('left' in q || 'right' in q) {
        fail('для set нельзя указывать left/right');
      }

      if (typeof q.answer === 'string') {
        if (new Set(q.answer).size !== q.answer.length) {
          fail('ответ set не должен содержать повторяющиеся цифры');
        }

        if (
          Array.isArray(q.options) &&
          [...q.answer].some(d => Number(d) < 1 || Number(d) > q.options.length)
        ) {
          fail('цифры ответа выходят за пределы вариантов');
        }
      }
    }

    if (q.type === 'match') {
      if (
        !Array.isArray(q.left) ||
        !q.left.length ||
        q.left.some(x => typeof x !== 'string' || !x.trim()) ||
        !Array.isArray(q.right) ||
        !q.right.length ||
        q.right.some(x => typeof x !== 'string' || !x.trim())
      ) {
        fail('left и right должны быть непустыми массивами строк');
      }

      if ('options' in q) {
        fail('для match нельзя указывать options');
      }

      if (
        typeof q.answer === 'string' &&
        Array.isArray(q.left) &&
        q.answer.length !== q.left.length
      ) {
        fail('длина ответа должна совпадать с числом позиций слева');
      }

      if (
        typeof q.answer === 'string' &&
        Array.isArray(q.right) &&
        [...q.answer].some(d => Number(d) < 1 || Number(d) > q.right.length)
      ) {
        fail('цифры ответа выходят за пределы правого столбца');
      }
    }
  });

  return errors;
}

function teacher() {
  currentScreen = 'teacher';
  clear();

  const c = card(
    'Для учителя',
    'Вставляйте партии банка по очереди. Новые задания с существующим id заменят старые. Если есть ошибки, вся партия отклоняется.'
  );

  c.append(node('h3', 'Вставьте JSON с заданиями'));

  const textarea = node('textarea');
  textarea.placeholder = '{"questions":[...]}';
  c.append(textarea);

  const feedback = node('div');

  actions(
    c,
    button('Проверить и добавить', () => {
      feedback.replaceChildren();

      let imported;

      try {
        imported = JSON.parse(textarea.value);
      } catch (error) {
        notice(feedback, 'Некорректный JSON: ' + error.message, 'error');
        return;
      }

      const errors = validateBatch(imported);

      if (errors.length) {
        feedback.append(node('h3', 'Ошибки — ничего не добавлено'));

        const list = node('ul');
        errors.forEach(message => list.append(node('li', message)));
        feedback.append(list);
        return;
      }

      const byId = new Map(bank.questions.map(q => [q.id, q]));

      imported.questions.forEach(q => {
        byId.set(q.id, q);
      });

      bank.questions = [...byId.values()];

      notice(
        feedback,
        `Добавлено или заменено: ${imported.questions.length}. Всего в банке: ${bank.questions.length}.`,
        'success'
      );

      coverage();
    }, 'primary'),
    button('Скачать тренажёр для учеников', exportTrainer)
  );

  c.append(feedback);

  const cover = card('Покрытие банка');
  cover.id = 'coverage';
  coverage();

  const warning = card('Важно');
  notice(
    warning,
    'В автономном HTML правильные ответы доступны в исходном коде. Это учебный тренажёр, а не защищённая контрольная работа.'
  );

  actions(warning, button('На главную', () => {
    location.hash = '';
    home();
  }));
}

function coverage() {
  const container = $('coverage');
  if (!container) return;

  container.replaceChildren();
  container.append(node('h2', 'Покрытие банка'));

  const table = node('table');
  const header = node('tr');

  ['Раздел','Диагностика','Практика','Контроль'].forEach(x => {
    header.append(node('th', x));
  });

  table.append(header);

  bank.spec.sections.forEach(section => {
    const row = node('tr');
    row.append(node('td', section.short));

    ['diagnostic','practice','control'].forEach(role => {
      const count = bank.questions.filter(q =>
        q.sectionId === section.id && q.role === role
      ).length;

      row.append(node('td', count));
    });

    table.append(row);
  });

  const wrap = node('div', undefined, 'scroll');
  wrap.append(table);

  append(
    container,
    wrap,
    node('p', `Всего заданий: ${bank.questions.length}`, 'muted')
  );
}

function exportTrainer() {
  const serialized = JSON.stringify(bank).replace(/</g, '\\u003c');

  const source = SOURCE.replace(
    /(<script\s+id="bank"\s+type="application\/json">)[\s\S]*?(<\/script>)/i,
    (_, opening, closing) => opening + serialized + closing
  );

  if (source === SOURCE) {
    alert('Не удалось найти встроенный банк в исходном HTML.');
    return;
  }

  downloadFile(
    'trainer-ege-obshestvo.html',
    source,
    'text/html;charset=utf-8'
  );
}

function route() {
  if (location.hash === '#teacher') {
    teacher();
  } else {
    home();
  }
}

window.addEventListener('hashchange', route);

$('teacherLink').addEventListener('click', e => {
  e.preventDefault();
  if (location.hash === '#teacher') teacher();
  else location.hash = '#teacher';
});

route();
</script></body></html>
