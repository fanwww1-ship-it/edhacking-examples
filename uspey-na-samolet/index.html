const scenes=[
{title:'Регистрация на рейс',place:'СТОЙКА РЕГИСТРАЦИИ',image:'happy',base:7,story:'Ты подбегаешь к стойке регистрации. Сотрудница улыбается, но очередь за тобой уже нервничает. Она смотрит на твой чемодан и задаёт первый вопрос.',q:'Do you have any bags to check in?',tr:'У вас есть багаж, который хотите сдать?',answers:[['Yes, I’d like to check in this suitcase.','Да, я хочу сдать этот чемодан.',0,'Чемодан отправляется на багажную ленту. Ты забираешь посадочный талон и уверенно идёшь дальше.','happy'],['Yes, I have a backpack with me.','Да, у меня с собой рюкзак.',4,'Сотрудница уточняет, что именно ты собираешься сдавать. Ты объясняешь разницу между рюкзаком и чемоданом, и оформление продолжается.','uncertain'],['No, I don’t have any bags.','Нет, у меня нет сумок.',9,'Сотрудница переводит взгляд на огромный чемодан рядом с тобой. Приходится заново объяснять ситуацию, пока очередь за спиной нетерпеливо вздыхает.','stress']]},
{title:'Проверка ручной клади',place:'ЗОНА ДОСМОТРА',image:'security',base:8,story:'Ты выкладываешь вещи в пластиковый лоток. Сканер пищит, сотрудник останавливает тебя и показывает на бутылку воды в рюкзаке.',q:'Do you have any liquids in your bag?',tr:'У вас есть жидкости в сумке?',answers:[['Yes, I have a bottle of water.','Да, у меня бутылка воды.',0,'Сотрудник просит убрать бутылку перед досмотром. Ты выполняешь просьбу и быстро проходишь контроль.','relief'],['Could you repeat that, please?','Не могли бы вы повторить?',3,'Сотрудник повторяет вопрос медленнее и показывает на бутылку. Ты всё понимаешь и спокойно решаешь вопрос.','uncertain'],['No, I don’t have anything.','Нет, у меня ничего нет.',10,'На экране сканера видна бутылка. Сотрудник просит открыть рюкзак и вручную проверяет содержимое. Минуты утекают.','surprised']]},
{title:'Паспортный контроль',place:'ПАСПОРТНЫЙ КОНТРОЛЬ',image:'uncertain',base:6,story:'Перед тобой серьёзный офицер. Он открывает паспорт, внимательно смотрит на фотографию и задаёт вопрос о поездке.',q:'What is the purpose of your visit?',tr:'Какова цель вашей поездки?',answers:[['I’m here on holiday.','Я приехал на отдых.',0,'Офицер кивает, проверяет документы и возвращает паспорт. Можно идти дальше!','happy'],['I’m staying for seven days.','Я остаюсь на семь дней.',4,'Офицер повторяет вопрос: его интересует цель поездки, а не срок. Ты исправляешься и получаешь паспорт.','uncertain'],['I want to work here.','Я хочу здесь работать.',12,'Офицер удивляется: твой ответ не совпадает с туристической целью поездки. После дополнительных вопросов и проверки брони отеля недоразумение разрешается.','stress']]},
{title:'Смена выхода на посадку',place:'ЗАЛ ВЫЛЕТА',image:'surprised',base:5,story:'Ты наконец видишь табло вылетов. Но внезапно раздаётся объявление: твой выход изменился! Вокруг шумно, и важно уловить каждое слово.',q:'Flight 247 is now boarding at Gate B12 instead of A5.',tr:'Посадка на рейс 247 теперь проходит у выхода B12 вместо A5.',answers:[['Go to Gate B12.','Идти к выходу B12.',0,'Ты быстро находишь указатель B12. Как хорошо, что ты внимательно слушал объявление!','happy'],['Ask an airport employee to confirm the gate.','Уточнить выход у сотрудника.',3,'Сотрудник подтверждает новый выход и показывает короткий маршрут. Теперь ты уверен, куда идти.','relief'],['Go to Gate A5.','Идти к выходу A5.',11,'Ты прибегаешь к A5, но там совершенно другой рейс. Твой самолёт теперь у B12! Приходится срочно разворачиваться.','stress']]},
{title:'Дорога к гейту',place:'ПЕРЕХОД МЕЖДУ ТЕРМИНАЛАМИ',image:'run',base:7,story:'Ты добегаешь до развилки. Указатели запутанные, а сотрудник аэропорта торопливо объясняет маршрут. Ты стараешься запомнить каждое слово.',q:'Go straight, take the escalator up, then turn left.',tr:'Идите прямо, поднимитесь на эскалаторе и поверните налево.',answers:[['Go straight, upstairs, then left.','Прямо, наверх, затем налево.',0,'Ты следуешь инструкции и выходишь к нужному коридору. Самолёт уже близко!','relief'],['Could you show me on the map?','Не могли бы вы показать на карте?',3,'Сотрудник показывает путь на схеме. Ты благодаришь его и уверенно идёшь дальше.','uncertain'],['Go downstairs and turn right.','Спуститься вниз и повернуть направо.',9,'Ты оказываешься возле зоны прилёта. Это точно не туда! Приходится возвращаться и искать нужный эскалатор.','stress']]},
{title:'Последний вызов на посадку',place:'ВЫХОД B12',image:'relief',base:7,story:'Ты видишь самолёт за огромным окном. Сотрудница у выхода смотрит на посадочный талон и обращается к тебе. Остался последний шаг!',q:'May I see your boarding pass and passport, please?',tr:'Можно ваш посадочный талон и паспорт?',answers:[['Of course. Here they are.','Конечно, вот они.',0,'Ты сразу достаёшь документы. Сотрудница сканирует посадочный талон и пропускает тебя к самолёту.','happy'],['One moment, please. I’ll find them.','Одну минуту, пожалуйста. Я их найду.',3,'Ты нервно роешься в рюкзаке, но наконец находишь паспорт и посадочный талон. Проверка завершена.','uncertain'],['Where is my suitcase?','Где мой чемодан?',8,'Сотрудница объясняет, что багаж уже оформлен, и снова просит документы. Ты наконец понимаешь вопрос и достаёшь их.','stress']]}
];
const app=document.getElementById('app');let stage=-1,remaining=60,selected=null,confirmed=false,translate=false,history=[];
function safe(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.83;window.speechSynthesis.speak(u)}
function intro(){app.innerHTML=`<div class="intro"><div class="introVisual"><img src="${IMG.intro}" alt="Героиня с чемоданом в аэропорту"></div><section class="introText"><div class="eyebrow">✦ English adventure</div><h1>Успей <span>на самолёт!</span> ✈️</h1><p>Ты целый год мечтал об этом отпуске. Билеты куплены, чемодан собран, отель ждёт. Но по дороге в аэропорт ты застрял в пробке…</p><div class="highlight">⏱ До закрытия посадки — 60 минут!</div><p>Впереди 6 испытаний, а все сотрудники говорят по-английски. От твоих ответов зависит, успеешь ли ты на рейс.</p><button class="primary" onclick="start()">Начать приключение →</button><div class="chips"><span class="chip">✈️ 6 ситуаций</span><span class="chip">🗣 Английский в действии</span><span class="chip">🏆 3 финала</span></div></section></div>`}
function start(){stage=0;remaining=60;selected=null;confirmed=false;translate=false;history=[];render()}
function render(){if(stage<0){intro();return}if(stage>=scenes.length){finish();return}let s=scenes[stage];let percent=Math.max(0,remaining)/60*100;let pic=s.image==='security'?IMG.security:IMG[s.image];app.innerHTML=`<div class="game"><div class="top"><span>ЭТАП ${stage+1} / ${scenes.length}</span><span class="clock">⏱ ${Math.max(0,remaining)} мин</span></div><div class="track"><div class="fill" style="width:${percent}%"></div></div><div class="scene"><div class="scenePic"><img src="${pic}" alt="${safe(s.place)}"><span class="tag">${safe(s.place)}</span></div><div><div class="eyebrow">СИТУАЦИЯ ${stage+1}</div><h2>${safe(s.title)}</h2><p>${safe(s.story)}</p><div class="quote"><button class="speak" title="Прослушать вопрос" aria-label="Прослушать английскую фразу" onclick="speak(scenes[stage].q)">🔊</button><div class="speaker">СОТРУДНИК АЭРОПОРТА ГОВОРИТ:</div><div class="question">“${safe(s.q)}”</div>${translate?`<div class="translation">${safe(s.tr)}</div>`:''}</div></div></div><div class="answers">${s.answers.map((a,i)=>`<button class="answer ${selected===i?'selected':''}" ${confirmed?'disabled':''} onclick="pick(${i})"><span class="letter">${'ABC'[i]}</span><span><div class="answerText">${safe(a[0])}</div>${translate?`<div class="answerSub">${safe(a[1])}</div>`:''}</span></button>`).join('')}</div>${confirmed?`<div class="consequence"><h3>🎬 Что произошло дальше?</h3><p>${safe(s.answers[selected][3])}</p><div class="emotion"><img src="${IMG[s.answers[selected][4]]}" alt="Эмоция героини"><span>${s.answers[selected][2]===0?'Отличное решение!':s.answers[selected][2]<=4?'Ты справился с недоразумением.':'Возникла серьёзная задержка.'}</span></div><div class="penalty">⏱ Потрачено ${s.base+s.answers[selected][2]} мин ${s.answers[selected][2]?'(включая задержку '+s.answers[selected][2]+' мин)':''}</div></div>`:''}<div class="actions"><button class="secondary" onclick="toggleTranslate()">🌐 ${translate?'Скрыть перевод':'Показать перевод'}</button><button class="primary" ${selected===null?'disabled':''} onclick="advance()">${confirmed?'Продолжить →':'Подтвердить выбор →'}</button></div></div>`}
function pick(i){if(confirmed)return;selected=i;render()}
function toggleTranslate(){translate=!translate;render()}
function advance(){if(selected===null)return;let s=scenes[stage];if(!confirmed){confirmed=true;let cost=s.base+s.answers[selected][2];remaining-=cost;history.push({title:s.title,cost,choice:s.answers[selected][0],feedback:s.answers[selected][3]});render()}else{stage++;selected=null;confirmed=false;translate=false;render();window.scrollTo({top:0,behavior:'smooth'})}}
function finish(){let outcome=remaining>=17?2:remaining>=0?1:0;let data=[{title:'Самолёт улетел без тебя 💔',pic:'sad',text:'Ты выбегаешь к выходу B12, но за стеклом самолёт уже отъезжает от терминала. Сотрудница сочувственно качает головой: посадка закрыта. Ты опускаешься на кресло, смотришь на пустой коридор и понимаешь, что отпуск начался совсем не так, как планировалось. Придётся искать новый билет.'},{title:'Успел в последнюю секунду! 😰',pic:'stress',text:'Ты врываешься к выходу на посадку, задыхаясь от бега. Рубашка мокрая, руки дрожат, в глазах почти слёзы. Сотрудница уже собиралась закрывать выход, но всё-таки пропускает тебя. Ты падаешь в кресло самолёта. Отпуск спасён, но после такого стресса тебе нужен ещё один отпуск.'},{title:'Отпуск начинается идеально! 😎',pic:'win',text:'Ты спокойно проходишь последний контроль, показываешь посадочный талон и заходишь в самолёт. Никакой паники, никакой беготни! Устраиваешься у окна, включаешь любимую музыку и улыбаешься: английский тебя не подвёл. Отпуск начинается идеально!'}][outcome];app.innerHTML=`<div class="final"><img class="finalHero" src="${IMG[data.pic]}" alt="Финал истории"><h1>${data.title}</h1><p class="finalStory">${data.text}</p><div class="stat">⏱ ${remaining>=0?`Осталось ${remaining} мин до закрытия посадки`:`Опоздание на ${Math.abs(remaining)} мин`}</div><div class="review"><h3>🧭 Как прошёл твой маршрут</h3>${history.map((h,i)=>`<div class="reviewRow"><span>${i+1}. ${safe(h.title)}</span><span>−${h.cost} мин</span></div>`).join('')}</div><button class="primary" onclick="start()">↻ Пройти ещё раз</button><div class="note">Попробуй другие ответы и посмотри, как изменится история!</div></div>`}
intro();
</script></body></html>
